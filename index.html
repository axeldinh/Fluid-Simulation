<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font: 12px/1 system-ui, sans-serif; color: #fff9; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e;
    border-radius: 999px; padding: 9px 14px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud button:active { background: #ffffff40; }
  #stats { margin-left: auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto; display: none;
    padding: 14px calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #000000c4; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #ffffff22;
    font: 13px/1.2 system-ui, sans-serif; color: #fffd; touch-action: pan-y; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel.open ~ #hud #stats, body.panel #stats { display: none; }
  body.panel #hud { background: linear-gradient(#0000, #000c 60%); }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; }
  #panel .row output { color: #fff9; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 28px; }
  #panel .row.check { grid-template-columns: auto 1fr; align-items: center; }
  #panel button { font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e; border-radius: 999px; padding: 9px 14px; }
  #hud { z-index: 2; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="mode">Mode: Water</button>
  <button id="clear">Reset</button>
  <button id="motion" hidden>Tilt: off</button>
  <button id="swirl">Swirl: on</button>
  <button id="gear">Settings</button>
  <div id="stats"></div>
</div>
<div id="panel"></div>
<div id="msg"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Real-time GPU fluid simulation (Stam "Stable Fluids" + vorticity confinement)
// WebGL2, all state lives in half-float textures. Adaptive resolution keeps it
// at a steady frame rate on phones.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);

function fail(text) {
  const m = $('msg'); m.textContent = text; m.style.display = 'flex';
  throw new Error(text);
}

const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This demo needs WebGL2, which your browser does not support.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('Your GPU cannot render to floating-point textures.');
gl.getExtension('OES_texture_float_linear');
const CAN_F32 = !!gl.getExtension('EXT_color_buffer_float');   // 32-bit pressure needed for large water/air density ratios

// Quality ladder: [simulation grid, dye grid, pressure iterations]
const LEVELS = [
  { sim: 48,  dye: 256, iter: 10 },
  { sim: 64,  dye: 384, iter: 14 },
  { sim: 96,  dye: 512, iter: 18 },
  { sim: 128, dye: 768, iter: 22 },
  { sim: 192, dye: 1024, iter: 26 },
];
// Two modes share one solver. 'dye' = coloured smoke you splat in. 'water' = a body of water
// (an advected 0..1 fill fraction on a staggered grid with a two-phase pressure solve) that gravity pulls down and that you can slosh, stir, and grow new blobs of.
const PRESETS = {
  dye:   { velocityDissipation: 0.25, densityDissipation: 0.6, pressure: 0.8,  curl: 25, splatRadius: 0.22, splatForce: 6000, dyeIntensity: 0.18 },
  water: { velocityDissipation: 0.02, densityDissipation: 0.5, pressure: 0.9,  curl: 0,  splatRadius: 0.4,  splatForce: 3000, dyeIntensity: 0.18 },
};
const cfg = {
  mode: 'water',
  level: 2,
  auto: true,
  ...PRESETS.water,
  gravity: 30,        // water mode: screen heights per second² (≈ Earth gravity for a 30 cm tank)
  ballGrowth: 0.25,   // water mode: how fast a held-down water ball grows (screen heights per second)
  sharpen: 1.06,      // water mode: interface contrast boost per frame
  waterAlgo: 'grid',  // 'grid' = Eulerian two-phase solver on the GPU, 'flip' = FLIP particles (CPU)
  flipRatio: 0.9,     // FLIP: 0 = pure PIC (smooth, damped), 1 = pure FLIP (lively, noisier)
  flipIters: 40,      // FLIP: pressure solver sweeps per step
  density: 800,       // water mode: water density relative to air (real water ≈ 800)
  swirl: true,
  tiltStrength: 1,    // multiplier for device-tilt gravity
  maxDpr: 1.5,
};

// ----- shaders -------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPosition;
out vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
in vec2 vUv, vL, vR, vT, vB;
out vec4 o;
`;
// Shared GLSL: sampling the staggered face velocities at an arbitrary point p (in cell units).
const VELSRC = `uniform sampler2D uU, uV; uniform vec2 gridSize;
vec2 uvU(vec2 p){ return vec2((p.x + 0.5) / (gridSize.x + 1.0), p.y / gridSize.y); }
vec2 uvV(vec2 p){ return vec2(p.x / gridSize.x, (p.y + 0.5) / (gridSize.y + 1.0)); }
vec2 velAt(vec2 p){ return vec2(texture(uU, uvU(p)).x, texture(uV, uvV(p)).x); }
`;
const FRAG = {
  copy: HEAD + `uniform sampler2D uTex; void main(){ o = textureLod(uTex, vUv, 0.0); }`,

  clear: HEAD + `uniform sampler2D uTex; uniform float value;
    void main(){ o = value * texture(uTex, vUv); }`,

  splat: HEAD + `uniform sampler2D uTarget; uniform float aspect; uniform vec3 color;
    uniform vec2 point; uniform float radius;
    void main(){
      vec2 p = vUv - point; p.x *= aspect;
      vec3 s = exp(-dot(p, p) / radius) * color;
      o = vec4(texture(uTarget, vUv).xyz + s, 1.0);
    }`,

  advection: HEAD + `uniform sampler2D uVelocity, uSource; uniform vec2 texelSize; uniform float dt, dissipation;
    void main(){
      vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
      o = textureLod(uSource, coord, 0.0) / (1.0 + dissipation * dt);
    }`,

  divergence: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).x, R = texture(uVelocity, vR).x;
      float T = texture(uVelocity, vT).y, B = texture(uVelocity, vB).y;
      vec2 C = texture(uVelocity, vUv).xy;
      if (vL.x < 0.0) L = -C.x;
      if (vR.x > 1.0) R = -C.x;
      if (vT.y > 1.0) T = -C.y;
      if (vB.y < 0.0) B = -C.y;
      o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
    }`,

  curl: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).y, R = texture(uVelocity, vR).y;
      float T = texture(uVelocity, vT).x, B = texture(uVelocity, vB).x;
      o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
    }`,

  vorticity: HEAD + `uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
    void main(){
      float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x;
      float T = texture(uCurl, vT).x, B = texture(uCurl, vB).x;
      float C = texture(uCurl, vUv).x;
      vec2 f = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      f /= length(f) + 0.0001;
      f *= curl * C; f.y *= -1.0;
      vec2 v = texture(uVelocity, vUv).xy + f * dt;
      o = vec4(clamp(v, -1000.0, 1000.0), 0.0, 1.0);
    }`,

  pressure: HEAD + `uniform sampler2D uPressure, uDivergence;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      float d = texture(uDivergence, vUv).x;
      o = vec4((L + R + B + T - d) * 0.25, 0.0, 0.0, 1.0);
    }`,

  // fine pressure += bilinearly interpolated coarse correction (manual, so 32-bit float textures work unfiltered)
  prolong: HEAD + `uniform sampler2D uP, uE;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), nf = textureSize(uP, 0), nc = textureSize(uE, 0);
      vec2 q = (vec2(c) + 0.5) * vec2(nc) / vec2(nf) - 0.5;
      ivec2 i0 = ivec2(floor(q)); vec2 f = q - vec2(i0);
      ivec2 a = clamp(i0, ivec2(0), nc - 1), b = clamp(i0 + 1, ivec2(0), nc - 1);
      float e = mix(mix(texelFetch(uE, ivec2(a.x, a.y), 0).x, texelFetch(uE, ivec2(b.x, a.y), 0).x, f.x),
                    mix(texelFetch(uE, ivec2(a.x, b.y), 0).x, texelFetch(uE, ivec2(b.x, b.y), 0).x, f.x), f.y);
      o = vec4(texelFetch(uP, c, 0).x + e, 0.0, 0.0, 1.0);
    }`,

  gradient: HEAD + `uniform sampler2D uPressure, uVelocity;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      vec2 v = texture(uVelocity, vUv).xy - 0.5 * vec2(R - L, T - B);
      if (vL.x < 0.0 || vR.x > 1.0) v.x = 0.0;      // solid walls: no flow through the boundary
      if (vB.y < 0.0 || vT.y > 1.0) v.y = 0.0;
      o = vec4(v, 0.0, 1.0);
    }`,

  // Volume bookkeeping: 4 taps per 128x128 cell; R = fill fraction, G = width of the surface band.
  massDown: HEAD + `uniform sampler2D uTex;
    void main(){
      vec2 d = vec2(0.25 / 128.0);
      float c = 0.25 * (clamp(texture(uTex, vUv + vec2( d.x,  d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x,  d.y)).x, 0.0, 1.0)
                      + clamp(texture(uTex, vUv + vec2( d.x, -d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x, -d.y)).x, 0.0, 1.0));
      o = vec4(c, 1.0 - abs(2.0 * c - 1.0), 0.0, 1.0);
    }`,

  // Keeps the water surface crisp and holds the water volume constant: the mean fill (uMass,
  // last mip level) is compared with the target and the surface is nudged out/in just enough
  // to cancel the numerical volume loss/gain of advection.
  sharpen: HEAD + `uniform sampler2D uTex, uMass; uniform float k, target, gain;
    void main(){
      float c = clamp(texture(uTex, vUv).x, 0.0, 1.0);
      vec2 m = textureLod(uMass, vec2(0.5), 7.0).xy;
      vec2 ts = vec2(vR.x - vUv.x, vT.y - vUv.y);
      float cb = 0.0;                                     // 3x3 blur -> a band a couple of texels wide around the surface
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        cb += clamp(texture(uTex, vUv + vec2(float(i), float(j)) * ts).x, 0.0, 1.0);
      float band = 1.0 - abs(2.0 * (cb / 9.0) - 1.0);
      float delta = clamp((target - m.x) * gain / max(m.y, 0.02), -0.3, 0.3);
      o = vec4(clamp((c - 0.5) * k + 0.5 + delta * band, 0.0, 1.0), 0.0, 0.0, 1.0);
    }`,

  // Stamp a solid ball of water (fill fraction -> 1) into the water field.
  stampPhi: HEAD + `uniform sampler2D uTex; uniform vec2 point; uniform float aspect, radius;
    void main(){
      vec2 d = vUv - point; d.x *= aspect;
      float inside = 1.0 - smoothstep(radius - 0.006, radius, length(d));
      vec4 t = texture(uTex, vUv);
      o = vec4(mix(t.x, 1.0, inside), t.yzw);
    }`,

  phiClamp: HEAD + `uniform sampler2D uTex;
    void main(){ o = vec4(clamp(texture(uTex, vUv).x, 0.0, 1.0), 0.0, 0.0, 1.0); }`,

  fill: HEAD + `void main(){ o = vec4(1.0 - smoothstep(0.38, 0.42, vUv.y), 0.0, 0.0, 1.0); }`,

  // ===== Water: staggered (MAC) grid + two-phase pressure projection =====
  // u lives on vertical cell faces, v on horizontal ones, pressure and the fill fraction in cells.
  phiDown: HEAD + `uniform sampler2D uWater; uniform vec2 cell;
    void main(){
      float s = 0.0;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        s += clamp(textureLod(uWater, vUv + vec2(float(i), float(j)) * cell * 0.33, 0.0).x, 0.0, 1.0);
      o = vec4(s / 9.0, 0.0, 0.0, 1.0);
    }`,

  // Face coefficients beta = 1/density between neighbouring cells (0 at solid walls).
  beta: HEAD + `uniform sampler2D uPhi; uniform float rhoA;     // water density = 1, air density = rhoA (= 1 / ratio)
    float rho(ivec2 c){ return mix(rhoA, 1.0, clamp(texelFetch(uPhi, c, 0).x, 0.0, 1.0)); }
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uPhi, 0);
      float r = rho(c);
      float bx = c.x < n.x - 1 ? 2.0 / (r + rho(c + ivec2(1, 0))) : 0.0;
      float by = c.y < n.y - 1 ? 2.0 / (r + rho(c + ivec2(0, 1))) : 0.0;
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  divMAC: HEAD + `uniform sampler2D uU, uV;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      o = vec4(texelFetch(uU, c + ivec2(1, 0), 0).x - texelFetch(uU, c, 0).x
             + texelFetch(uV, c + ivec2(0, 1), 0).x - texelFetch(uV, c, 0).x, 0.0, 0.0, 1.0);
    }`,

  // damped Jacobi on  sum_f beta_f (p_n - p) = div
  jacobiW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float sum = b.x + bL + b.y + bB, s = 0.0;
      if (b.x > 0.0) s += b.x * texelFetch(uP, c + ivec2(1, 0), 0).x;
      if (bL > 0.0)  s += bL  * texelFetch(uP, c - ivec2(1, 0), 0).x;
      if (b.y > 0.0) s += b.y * texelFetch(uP, c + ivec2(0, 1), 0).x;
      if (bB > 0.0)  s += bB  * texelFetch(uP, c - ivec2(0, 1), 0).x;
      float pj = (s - texelFetch(uD, c, 0).x) / max(sum, 1e-6);
      o = vec4(p + 0.8 * (pj - p), 0.0, 0.0, 1.0);
    }`,

  residualW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float f = 0.0;
      if (b.x > 0.0) f += b.x * (texelFetch(uP, c + ivec2(1, 0), 0).x - p);
      if (bL > 0.0)  f += bL  * (texelFetch(uP, c - ivec2(1, 0), 0).x - p);
      if (b.y > 0.0) f += b.y * (texelFetch(uP, c + ivec2(0, 1), 0).x - p);
      if (bB > 0.0)  f += bB  * (texelFetch(uP, c - ivec2(0, 1), 0).x - p);
      o = vec4(texelFetch(uD, c, 0).x - f, 0.0, 0.0, 1.0);
    }`,

  restrictResW: HEAD + `uniform sampler2D uR;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uR, 0);
      float s = 0.0;
      for (int i = 0; i < 2; i++) for (int j = 0; j < 2; j++) {
        ivec2 f = c + ivec2(i, j);
        if (f.x < n.x && f.y < n.y) s += texelFetch(uR, f, 0).x;
      }
      o = vec4(s, 0.0, 0.0, 1.0);
    }`,

  restrictBetaW: HEAD + `uniform sampler2D uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uB, 0);
      float bx = 0.0, by = 0.0;
      ivec2 fx = c + ivec2(1, 0);
      if (fx.x < n.x) { float a = texelFetch(uB, fx, 0).x; float b2 = fx.y + 1 < n.y ? texelFetch(uB, fx + ivec2(0, 1), 0).x : a; bx = 0.5 * (a + b2); }
      ivec2 fy = c + ivec2(0, 1);
      if (fy.y < n.y) { float a = texelFetch(uB, fy, 0).y; float b2 = fy.x + 1 < n.x ? texelFetch(uB, fy + ivec2(1, 0), 0).y : a; by = 0.5 * (a + b2); }
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  // Pressure update of the face velocities. Air is ~800x lighter than water, so tiny pressure errors in
  // the air become large air velocities; slow-moving faces that touch no water are therefore damped away
  // (fast ones, e.g. the air around a falling ball, are left alone).
  projectU: HEAD + `uniform sampler2D uU, uP, uB, uPhi; uniform float airCap;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uP, 0);
      if (c.x <= 0 || c.x >= n.x) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
      float b = texelFetch(uB, c - ivec2(1, 0), 0).x;
      float u = texelFetch(uU, c, 0).x - b * (texelFetch(uP, c, 0).x - texelFetch(uP, c - ivec2(1, 0), 0).x);
      float w = 0.5 * (texelFetch(uPhi, c, 0).x + texelFetch(uPhi, c - ivec2(1, 0), 0).x);
      float air = 1.0 - smoothstep(0.02, 0.3, w);
      u = mix(u, clamp(u, -airCap, airCap), air);                       // light air can't go faster than a few screen heights per second
      o = vec4(u * max(1.0 - air, smoothstep(30.0, 150.0, abs(u))), 0.0, 0.0, 1.0);
    }`,
  projectV: HEAD + `uniform sampler2D uV, uP, uB, uPhi; uniform float airCap;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uP, 0);
      if (c.y <= 0 || c.y >= n.y) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
      float b = texelFetch(uB, c - ivec2(0, 1), 0).y;
      float v = texelFetch(uV, c, 0).x - b * (texelFetch(uP, c, 0).x - texelFetch(uP, c - ivec2(0, 1), 0).x);
      float w = 0.5 * (texelFetch(uPhi, c, 0).x + texelFetch(uPhi, c - ivec2(0, 1), 0).x);
      float air = 1.0 - smoothstep(0.02, 0.3, w);
      v = mix(v, clamp(v, -airCap, airCap), air);
      o = vec4(v * max(1.0 - air, smoothstep(30.0, 150.0, abs(v))), 0.0, 0.0, 1.0);
    }`,

  // Semi-Lagrangian advection (midpoint backtrace) of the face velocities by themselves.
  advectFaces: HEAD + VELSRC + `uniform float dt, damp, kind;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      vec2 p = kind < 0.5 ? vec2(float(c.x), float(c.y) + 0.5) : vec2(float(c.x) + 0.5, float(c.y));
      vec2 pm = clamp(p - 0.5 * dt * velAt(p), vec2(0.0), gridSize);
      vec2 p0 = clamp(p - dt * velAt(pm), vec2(0.0), gridSize);
      float v = kind < 0.5 ? texture(uU, uvU(p0)).x : texture(uV, uvV(p0)).x;
      bool wall = kind < 0.5 ? (c.x == 0 || c.x == int(gridSize.x)) : (c.y == 0 || c.y == int(gridSize.y));
      o = vec4(wall ? 0.0 : v / (1.0 + damp * dt), 0.0, 0.0, 1.0);
    }`,

  forceFaces: HEAD + `uniform sampler2D uTex; uniform vec2 gridSize; uniform float acc, kind;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);

    let sum = 0; for (let i = 0; i < a.length; i += 4) sum += a[i];
    waterTarget = Math.min(0.9, sum / (128 * 128));
  } catch (_) { waterTarget = Math.min(0.9, waterTarget + Math.PI * r * r / aspect * 0.5); }
}

// ----- splats / input ------------------------------------------------------
function splatInto(target, x, y, a, b, c, radius) {
  texUnit = 0; const u = use(P.splat);
  bindTex(u.uTarget, target.read);
  gl.uniform1f(u.aspect, canvas.width / canvas.height); gl.uniform2f(u.point, x, y);
  gl.uniform3f(u.color, a, b, c); gl.uniform1f(u.radius, radius);
  blit(target.write); target.swap();
}
function splatRadius() { const aspect = canvas.width / canvas.height; return (cfg.splatRadius / 100) * (aspect > 1 ? aspect : 1); }
function splat(x, y, dx, dy, color) {
  const radius = splatRadius();
  if (cfg.mode === 'water' && cfg.waterAlgo === 'flip') {
    const f = FL.sim, k = f.ny / WS.grid[1];       // push velocities are given in (grid-solver cells)/s; convert to FLIP cells
    f.stir(1 + x * f.nx, 1 + y * f.ny, radius * f.ny * f.ny, dx * k, dy * k);
    return;
  }
  if (cfg.mode === 'water') {
    const [W, H] = WS.grid, aspect = canvas.width / canvas.height;
    for (const [kind, amount, T] of [[0, dx, WS.U], [1, dy, WS.V]]) {
      texUnit = 0; const u = use(P.splatFaces); bindTex(u.uTex, T.read);
      gl.uniform2f(u.gridSize, W, H); gl.uniform2f(u.point, x, y); gl.uniform1f(u.aspect, aspect);
      gl.uniform1f(u.radius, radius); gl.uniform1f(u.kind, kind); gl.uniform1f(u.amount, amount); gl.uniform1f(u.stamp, 0);
      blit(T.write); T.swap();
    }
    return;
  }
  splatInto(velocity, x, y, dx, dy, 0, radius);
  splatInto(dye, x, y, color[0], color[1], color[2], radius);
}
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
let hue = Math.random();
function nextColor() {
  hue = (hue + 0.13 + Math.random() * 0.1) % 1;
  const c = hsv(hue, 0.85, 1); return c.map(x => x * cfg.dyeIntensity);
}

const pointers = new Map();
let lastInput = performance.now();
const aspectDX = d => (canvas.width / canvas.height < 1 ? d * (canvas.width / canvas.height) : d);
const aspectDY = d => (canvas.width / canvas.height > 1 ? d / (canvas.width / canvas.height) : d);

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  const p = { x, y, dx: 0, dy: 0, moved: false, color: nextColor(), hold: null };
  pointers.set(e.pointerId, p);
  if (cfg.mode === 'water') p.hold = { on: true, r: 0, cx: e.clientX, cy: e.clientY };   // hold still to grow a water ball
  else splat(x, y, 0, 0, p.color.map(c => c * 2));
  lastInput = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  p.dx += aspectDX(x - p.x); p.dy += aspectDY(y - p.y);
  p.x = x; p.y = y; p.moved = true; lastInput = performance.now();
  if (p.hold && p.hold.on && Math.hypot(e.clientX - p.hold.cx, e.clientY - p.hold.cy) > 14) p.hold.on = false;   // dragging = stirring, not a ball
});
const up = e => {
  const p = pointers.get(e.pointerId);
  if (p && p.hold && p.hold.on && p.hold.r > 0.01 && e.type === 'pointerup') stampBall(p.x, p.y, p.hold.r);
  pointers.delete(e.pointerId);
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

const BALL_MAX = 0.22;    // largest ball radius, in screen heights
function applyPointers(dt) {
  for (const p of pointers.values()) {
    if (p.hold && p.hold.on) {            // still holding: grow the ball, don't stir
      p.hold.r = Math.min(BALL_MAX, p.hold.r + cfg.ballGrowth * dt);
      p.dx = p.dy = 0; p.moved = false; continue;
    }
    if (!p.moved) continue;
    splat(p.x, p.y, p.dx * cfg.splatForce, p.dy * cfg.splatForce, p.color);
    p.dx = p.dy = 0; p.moved = false;
  }
}
function randomSplat(strength = 1) {
  const x = Math.random(), y = Math.random(), a = Math.random() * Math.PI * 2;
  const f = (600 + Math.random() * 900) * strength;
  splat(x, y, Math.cos(a) * f, Math.sin(a) * f, nextColor().map(c => c * 1.5));
}

// Tilt: the phone's gravity vector drives the fluid (iOS needs a user gesture to grant access).
// tilt.gx/gy is the direction gravity pulls in screen space (+y = up the screen), magnitude <= ~1.
const tilt = { on: false, gx: 0, gy: -1 };
const grav = { x: 0, y: -1 };      // smoothed gravity direction used by the water solver
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const s = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let gx = a.x, gy = a.y;
  if (s === 90) [gx, gy] = [-a.y, a.x]; else if (s === 270 || s === -90) [gx, gy] = [a.y, -a.x]; else if (s === 180) [gx, gy] = [-a.x, -a.y];
  // Android reports the reaction to gravity (+y when upright); iOS reports the opposite sign.
  const k = (IOS ? 1 : -1) / 9.8; tilt.gx = gx * k; tilt.gy = gy * k;
}
function updateGravity(dt) {
  let tx = 0, ty = -1;
  if (tilt.on) { tx = tilt.gx; ty = tilt.gy; const m = Math.hypot(tx, ty); if (m > 1) { tx /= m; ty /= m; } }
  const f = Math.min(1, dt * 10); grav.x += (tx - grav.x) * f; grav.y += (ty - grav.y) * f;
}
if ('DeviceMotionEvent' in window && matchMedia('(pointer: coarse)').matches) {
  const b = $('motion'); b.hidden = false;
  b.onclick = async () => {
    if (tilt.on) { tilt.on = false; window.removeEventListener('devicemotion', onMotion); b.textContent = 'Tilt: off'; return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function' && (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
      window.addEventListener('devicemotion', onMotion); tilt.on = true; b.textContent = 'Tilt: on';
    } catch (_) {}
  };
}
function applyTilt(dt) {
  if (!tilt.on || cfg.mode === 'water') return;     // water mode uses tilt as the gravity direction instead
  const m = Math.hypot(tilt.gx, tilt.gy); if (m < 0.08) return;
  // inject a gentle uniform acceleration through a few wide, invisible velocity splats
  const f = 900 * dt * 60 * cfg.tiltStrength;
  for (const [x, y] of [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.5, 0.5]])
    splatInto(velocity, x, y, tilt.gx * f * 0.02, tilt.gy * f * 0.02, 0, 0.35);
}

$('clear').onclick = () => { [velocity, dye, pressure, water].forEach(d => { clearFB(d.read); clearFB(d.write); }); clearWaterFlow(); fillWater(); if (FL.sim) fillFlip(); };
function setMode(m, fromPreset = true) {
  cfg.mode = m; if (fromPreset) Object.assign(cfg, PRESETS[m]);
  $('mode').textContent = 'Mode: ' + (m === 'water' ? 'Water' : 'Dye');
  for (const k in widgets) widgets[k]();
  applyModeVisibility();
}
$('mode').onclick = () => { setMode(cfg.mode === 'water' ? 'dye' : 'water'); save(); };
$('swirl').onclick = e => { cfg.swirl = !cfg.swirl; e.target.textContent = 'Swirl: ' + (cfg.swirl ? 'on' : 'off'); };

window.addEventListener('resize', () => { if (resizeCanvas()) initBuffers(); });

// ----- settings panel --------------------------------------------------------
const W_ = ['water'], D_ = ['dye'], GRID = ['grid'], FLIPA = ['flip'];
const SCHEMA = [
  { k: 'gravity', label: 'Gravity', min: 0, max: 40, step: 0.5, modes: W_, hint: 'Screen heights per second². Earth-like for a ~30 cm tank is about 30.' },
  { k: 'flipRatio', label: 'FLIP blend (0 = smooth PIC, 1 = splashy FLIP)', min: 0, max: 1, step: 0.01, modes: W_, algos: FLIPA },
  { k: 'flipIters', label: 'Pressure iterations (CPU cost)', min: 10, max: 120, step: 5, modes: W_, algos: FLIPA,
    hint: 'More = water behaves more incompressibly, but costs more CPU.' },
  { k: 'density', label: 'Water density vs air', min: 2, max: 1000, step: 1, log: true, modes: W_, algos: GRID,
    hint: 'Real water is ≈ 800× denser than air. Lower = lighter water, faster but floatier splashes.' },
  { k: 'ballGrowth', label: 'Water ball growth speed', min: 0.05, max: 1, step: 0.05, modes: W_ },
  { k: 'tiltStrength', label: 'Tilt gravity strength', min: 0, max: 5, step: 0.1, modes: W_ },
  { k: 'curl', label: 'Swirliness (vorticity)', min: 0, max: 60, step: 1, modes: D_ },
  { k: 'densityDissipation', label: 'Dye fade', min: 0, max: 4, step: 0.05, modes: D_ },
  { k: 'dyeIntensity', label: 'Dye amount', min: 0.02, max: 0.6, step: 0.01, modes: D_ },
  { k: 'velocityDissipation', label: 'Velocity damping', min: 0, max: 4, step: 0.05, algos: GRID },
  { k: 'pressure', label: 'Pressure persistence', min: 0, max: 1, step: 0.01, algos: GRID },
  { k: 'splatRadius', label: 'Brush size', min: 0.05, max: 1, step: 0.01 },
  { k: 'splatForce', label: 'Stir force', min: 500, max: 20000, step: 100 },
  { k: 'maxDpr', label: 'Render scale', min: 0.5, max: 3, step: 0.25, apply: () => { resizeCanvas(); initBuffers(); } },
];
const DEFAULTS = Object.assign({}, cfg);
const KEY = 'fluidCfg5';
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in saved) if (k in DEFAULTS) cfg[k] = saved[k]; } catch (_) {}
resizeCanvas(); initBuffers();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} };
const panel = $('panel'), widgets = {};
function addRow(html) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = html; panel.appendChild(d); return d; }
const rows = [];
{
  const r = addRow(`<label>Water algorithm</label><span></span><select style="grid-column:1/-1;font:inherit;padding:8px;border-radius:8px;background:#ffffff1f;color:#fff;border:1px solid #ffffff2e">
    <option value="grid" style="color:#000">Grid — two-phase solver (GPU)</option>
    <option value="flip" style="color:#000">FLIP — particles + grid (CPU)</option></select>
    <small style="grid-column:1/-1;color:#fff8">They are different methods with different looks and costs. Switching refills the tank.</small>`);
  r.dataset.modes = 'water'; r.dataset.algos = 'grid flip'; rows.push(r);
  const sel = r.querySelector('select'); sel.value = cfg.waterAlgo;
  sel.onchange = () => { setAlgo(sel.value); save(); };
  widgets.waterAlgo = () => { sel.value = cfg.waterAlgo; };
}
for (const s of SCHEMA) {
  const lo = s.log ? 0 : s.min, hi = s.log ? 1 : s.max, st = s.log ? 0.001 : s.step;
  const row = addRow(`<label>${s.label}</label><output></output><input type="range" min="${lo}" max="${hi}" step="${st}">`
    + (s.hint ? `<small style="grid-column:1/-1;color:#fff8;margin-top:-2px">${s.hint}</small>` : ''));
  row.dataset.modes = (s.modes || ['dye', 'water']).join(' '); row.dataset.algos = (s.algos || ['grid', 'flip']).join(' '); rows.push(row);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const fmt = v => s.log ? (v >= 100 ? Math.round(v) : +v.toPrecision(2)) + '×' : +(+v).toFixed(2);
  const toVal = t => s.log ? Math.round(s.min * Math.pow(s.max / s.min, t) * 10) / 10 : t;
  const show = () => { inp.value = s.log ? Math.log(cfg[s.k] / s.min) / Math.log(s.max / s.min) : cfg[s.k]; out.textContent = fmt(+cfg[s.k]); };
  inp.oninput = () => { cfg[s.k] = toVal(+inp.value); out.textContent = fmt(cfg[s.k]); if (!s.apply) save(); };
  if (s.apply) inp.onchange = () => { s.apply(); save(); };
  widgets[s.k] = show; show();
}
{
  const dRow = rows[SCHEMA.findIndex(x => x.k === 'density')];
  const box = document.createElement('div'); box.className = 'row'; box.dataset.modes = 'water'; box.dataset.algos = 'grid'; box.dataset.disp = 'flex'; box.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
  for (const [label, v] of [['Real water (800×)', 800], ['Balanced (100×)', 100], ['Light & fast (16×)', 16]]) {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { cfg.density = v; widgets.density(); save(); };
    box.appendChild(b);
  }
  dRow.after(box); rows.push(box);
}
function setAlgo(a) {
  cfg.waterAlgo = a;
  if (a === 'flip') { if (!FL.sim) buildFlip(); fillFlip(); }
  else { [velocity, dye, pressure, water].forEach(d => { clearFB(d.read); clearFB(d.write); }); clearWaterFlow(); fillWater(); }
  if (widgets.waterAlgo) widgets.waterAlgo();
  applyModeVisibility();
}
function applyModeVisibility() {      // only show the settings that matter for the current mode
  for (const r of rows) {
    const show = r.dataset.modes.split(' ').includes(cfg.mode) && (cfg.mode !== 'water' || r.dataset.algos.split(' ').includes(cfg.waterAlgo));
    r.style.display = show ? (r.dataset.disp || '') : 'none';
  }
  $('swirl').style.display = cfg.mode === 'dye' ? '' : 'none';
}
{
  const r = addRow(`<label>Resolution level</label><output></output><input type="range" min="0" max="${LEVELS.length - 1}" step="1">`);
  const inp = r.querySelector('input'), out = r.querySelector('output');
  const show = () => { inp.value = cfg.level; const L = LEVELS[cfg.level]; out.textContent = `${cfg.level} (sim ${L.sim}, dye ${L.dye})`; };
  inp.oninput = () => { cfg.level = +inp.value; perf.ceiling = LEVELS.length - 1; show(); };
  inp.onchange = () => { initBuffers(); save(); };
  widgets.level = show; show();
  const c = document.createElement('div'); c.className = 'row check';
  c.innerHTML = `<input type="checkbox" id="auto"><label for="auto">Auto-adjust resolution to keep 60 fps</label>`;
  panel.appendChild(c);
  const cb = c.querySelector('input'); cb.checked = cfg.auto;
  cb.onchange = () => { cfg.auto = cb.checked; perf.goodSecs = 0; save(); };
}
{
  const b = document.createElement('button'); b.textContent = 'Reset to defaults';
  b.onclick = () => { Object.assign(cfg, DEFAULTS); perf.ceiling = LEVELS.length - 1; resizeCanvas(); initBuffers();
    setMode(cfg.mode, false); panel.querySelector('#auto').checked = cfg.auto; save(); };
  panel.appendChild(b);
}
setMode(cfg.mode, false);
if (cfg.waterAlgo === 'flip' && !FL.sim) buildFlip();
$('gear').onclick = () => { document.body.classList.toggle('panel', panel.classList.toggle('open')); };

// ----- adaptive quality ----------------------------------------------------
const perf = { frames: 0, acc: 0, fps: 60, goodSecs: 0, ceiling: LEVELS.length - 1 };
function adapt(rawDt) {
  perf.frames++; perf.acc += rawDt;
  if (perf.acc < 1) return;               // evaluate once per second
  perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0;
  if (!cfg.auto) {}
  else if (perf.fps < 40 && cfg.level > 0) {
    cfg.level--; perf.ceiling = cfg.level; perf.goodSecs = 0; initBuffers();   // never climb back above a level that failed
  } else if (perf.fps > 55 && cfg.level < perf.ceiling) {
    if (++perf.goodSecs >= 3) { cfg.level++; perf.goodSecs = 0; initBuffers(); }
  } else perf.goodSecs = 0;
  if (widgets.level) widgets.level();
  const L = LEVELS[cfg.level];
  $('stats').textContent = `${Math.round(perf.fps)} fps · sim ${L.sim} · dye ${L.dye}`;
}

// ----- main loop -----------------------------------------------------------
let last = performance.now(), nextAuto = last + 400;
if (cfg.mode === 'dye') for (let i = 0; i < 5; i++) randomSplat(1.5);
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(Math.max(raw, 0.001), 1 / 30);
  if (cfg.mode === 'dye' && now > nextAuto && now - lastInput > 4000 && pointers.size === 0) {   // idle: keep it alive
    randomSplat(0.8); nextAuto = now + 1200 + Math.random() * 1500;
  }
  updateGravity(dt); applyPointers(dt); applyTilt(dt);
  if (cfg.mode === 'water') { if (cfg.waterAlgo === 'flip') stepFlip(dt); else stepWater(dt); } else step(dt);
  render();
  if (raw < 0.5) adapt(raw);              // ignore tab-switch hiccups
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('WebGL context lost. Reload the page.'); });
</script>
</body>
