<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center;
    padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font: 12px/1 system-ui, sans-serif; color: #fff9; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e;
    border-radius: 999px; padding: 9px 14px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud button:active { background: #ffffff40; }
  #stats { margin-left: auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto; display: none;
    padding: 14px calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #000000c4; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #ffffff22;
    font: 13px/1.2 system-ui, sans-serif; color: #fffd; touch-action: pan-y; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel.open ~ #hud #stats, body.panel #stats { display: none; }
  body.panel #hud { background: linear-gradient(#0000, #000c 60%); }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; }
  #panel .row output { color: #fff9; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 28px; }
  #panel .row.check { grid-template-columns: auto 1fr; align-items: center; }
  #panel button { font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e; border-radius: 999px; padding: 9px 14px; }
  #hud { z-index: 2; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="clear">Clear</button>
  <button id="motion" hidden>Tilt: off</button>
  <button id="swirl">Swirl: on</button>
  <button id="gear">Settings</button>
  <div id="stats"></div>
</div>
<div id="panel"></div>
<div id="msg"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Real-time GPU fluid simulation (Stam "Stable Fluids" + vorticity confinement)
// WebGL2, all state lives in half-float textures. Adaptive resolution keeps it
// at a steady frame rate on phones.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);

function fail(text) {
  const m = $('msg'); m.textContent = text; m.style.display = 'flex';
  throw new Error(text);
}

const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This demo needs WebGL2, which your browser does not support.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('Your GPU cannot render to floating-point textures.');
gl.getExtension('OES_texture_float_linear');

// Quality ladder: [simulation grid, dye grid, pressure iterations]
const LEVELS = [
  { sim: 48,  dye: 256, iter: 10 },
  { sim: 64,  dye: 384, iter: 14 },
  { sim: 96,  dye: 512, iter: 18 },
  { sim: 128, dye: 768, iter: 22 },
  { sim: 192, dye: 1024, iter: 26 },
];
const cfg = {
  level: 2,
  auto: true,
  densityDissipation: 0.6,
  velocityDissipation: 0.25,
  pressure: 0.8,
  curl: 25,
  splatRadius: 0.22,   // percent of screen height
  splatForce: 6000,
  dyeIntensity: 0.18,
  swirl: true,
  tiltStrength: 1,    // multiplier for device-tilt gravity
  maxDpr: 1.5,
};

// ----- shaders -------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPosition;
out vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv, vL, vR, vT, vB;
out vec4 o;
`;
const FRAG = {
  copy: HEAD + `uniform sampler2D uTex; void main(){ o = texture(uTex, vUv); }`,

  clear: HEAD + `uniform sampler2D uTex; uniform float value;
    void main(){ o = value * texture(uTex, vUv); }`,

  splat: HEAD + `uniform sampler2D uTarget; uniform float aspect; uniform vec3 color;
    uniform vec2 point; uniform float radius;
    void main(){
      vec2 p = vUv - point; p.x *= aspect;
      vec3 s = exp(-dot(p, p) / radius) * color;
      o = vec4(texture(uTarget, vUv).xyz + s, 1.0);
    }`,

  advection: HEAD + `uniform sampler2D uVelocity, uSource; uniform vec2 texelSize; uniform float dt, dissipation;
    void main(){
      vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
      o = texture(uSource, coord) / (1.0 + dissipation * dt);
    }`,

  divergence: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).x, R = texture(uVelocity, vR).x;
      float T = texture(uVelocity, vT).y, B = texture(uVelocity, vB).y;
      vec2 C = texture(uVelocity, vUv).xy;
      if (vL.x < 0.0) L = -C.x;
      if (vR.x > 1.0) R = -C.x;
      if (vT.y > 1.0) T = -C.y;
      if (vB.y < 0.0) B = -C.y;
      o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
    }`,

  curl: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).y, R = texture(uVelocity, vR).y;
      float T = texture(uVelocity, vT).x, B = texture(uVelocity, vB).x;
      o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
    }`,

  vorticity: HEAD + `uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
    void main(){
      float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x;
      float T = texture(uCurl, vT).x, B = texture(uCurl, vB).x;
      float C = texture(uCurl, vUv).x;
      vec2 f = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      f /= length(f) + 0.0001;
      f *= curl * C; f.y *= -1.0;
      vec2 v = texture(uVelocity, vUv).xy + f * dt;
      o = vec4(clamp(v, -1000.0, 1000.0), 0.0, 1.0);
    }`,

  pressure: HEAD + `uniform sampler2D uPressure, uDivergence;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      float d = texture(uDivergence, vUv).x;
      o = vec4((L + R + B + T - d) * 0.25, 0.0, 0.0, 1.0);
    }`,

  gradient: HEAD + `uniform sampler2D uPressure, uVelocity;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      vec2 v = texture(uVelocity, vUv).xy - vec2(R - L, T - B);
      o = vec4(v, 0.0, 1.0);
    }`,

  display: HEAD + `uniform sampler2D uDye;
    float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main(){
      vec3 c = texture(uDye, vUv).rgb;
      // cheap relief lighting from the dye's luminance gradient
      float dx = lum(texture(uDye, vR).rgb) - lum(texture(uDye, vL).rgb);
      float dy = lum(texture(uDye, vT).rgb) - lum(texture(uDye, vB).rgb);
      vec3 n = normalize(vec3(-dx, -dy, 0.04));
      float diffuse = clamp(dot(n, normalize(vec3(-0.4, 0.5, 0.8))) * 0.5 + 0.5, 0.6, 1.2);
      c *= diffuse;
      c = 1.0 - exp(-1.6 * max(c, 0.0));          // soft tone map
      c = pow(c, vec3(1.0 / 1.1));
      o = vec4(c, 1.0);
    }`,
};

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(s));
  return s;
}
const vs = compile(gl.VERTEX_SHADER, VERT);
function program(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPosition');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const P = {};
for (const k in FRAG) P[k] = program(FRAG[k]);

// full-screen quad
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function blit(target) {
  if (target) { gl.viewport(0, 0, target.w, target.h); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo); }
  else { gl.viewport(0, 0, canvas.width, canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function use(prog, texel) {
  gl.useProgram(prog.p);
  if (texel) gl.uniform2f(prog.u.texelSize, texel[0], texel[1]);
  return prog.u;
}
let texUnit = 0;
function bindTex(loc, fb) { gl.activeTexture(gl.TEXTURE0 + texUnit); gl.bindTexture(gl.TEXTURE_2D, fb.tex); gl.uniform1i(loc, texUnit++); }

// ----- framebuffers --------------------------------------------------------
function makeFBO(w, h, filter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('Float framebuffer unsupported.');
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo, w, h, texel: [1 / w, 1 / h], destroy() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); } };
}
function makeDouble(w, h, filter) {
  const d = { read: makeFBO(w, h, filter), write: makeFBO(w, h, filter),
    swap() { const t = this.read; this.read = this.write; this.write = t; },
    destroy() { this.read.destroy(); this.write.destroy(); } };
  return d;
}
// Resample an existing double buffer into new dimensions (used when quality changes).
function resizeDouble(old, w, h, filter) {
  const n = makeDouble(w, h, filter);
  if (old) {
    texUnit = 0; const u = use(P.copy); bindTex(u.uTex, old.read); blit(n.read);
    old.destroy();
  }
  return n;
}

let velocity, dye, divergence, curl, pressure;
function gridSize(res) {
  let a = canvas.width / canvas.height; if (a < 1) a = 1 / a;
  const lo = Math.round(res), hi = Math.round(res * a);
  return canvas.width > canvas.height ? [hi, lo] : [lo, hi];
}
function initBuffers() {
  const L = LEVELS[cfg.level];
  const [sw, sh] = gridSize(L.sim), [dw, dh] = gridSize(L.dye);
  velocity = resizeDouble(velocity, sw, sh, gl.LINEAR);
  dye = resizeDouble(dye, dw, dh, gl.LINEAR);
  [divergence, curl].forEach(f => f && f.destroy());
  if (pressure) pressure.destroy();
  divergence = makeFBO(sw, sh, gl.NEAREST);
  curl = makeFBO(sw, sh, gl.NEAREST);
  pressure = makeDouble(sw, sh, gl.NEAREST);
}
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, cfg.maxDpr);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr)), h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (w === canvas.width && h === canvas.height) return false;
  canvas.width = w; canvas.height = h; return true;
}
resizeCanvas(); initBuffers();

// ----- simulation step -----------------------------------------------------
function step(dt) {
  const L = LEVELS[cfg.level];
  const vt = velocity.read.texel;
  let u;

  texUnit = 0; u = use(P.curl, vt); bindTex(u.uVelocity, velocity.read); blit(curl);

  texUnit = 0; u = use(P.vorticity, vt);
  bindTex(u.uVelocity, velocity.read); bindTex(u.uCurl, curl);
  gl.uniform1f(u.curl, cfg.swirl ? cfg.curl : 0); gl.uniform1f(u.dt, dt);
  blit(velocity.write); velocity.swap();

  texUnit = 0; u = use(P.divergence, vt); bindTex(u.uVelocity, velocity.read); blit(divergence);

  texUnit = 0; u = use(P.clear); bindTex(u.uTex, pressure.read); gl.uniform1f(u.value, cfg.pressure);
  blit(pressure.write); pressure.swap();

  u = use(P.pressure, vt);
  for (let i = 0; i < L.iter; i++) {
    texUnit = 0; bindTex(u.uDivergence, divergence); bindTex(u.uPressure, pressure.read);
    blit(pressure.write); pressure.swap();
  }

  texUnit = 0; u = use(P.gradient, vt); bindTex(u.uPressure, pressure.read); bindTex(u.uVelocity, velocity.read);
  blit(velocity.write); velocity.swap();

  texUnit = 0; u = use(P.advection, vt);
  bindTex(u.uVelocity, velocity.read); bindTex(u.uSource, velocity.read);
  gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, cfg.velocityDissipation);
  blit(velocity.write); velocity.swap();

  texUnit = 0; u = use(P.advection, vt);
  bindTex(u.uVelocity, velocity.read); bindTex(u.uSource, dye.read);
  gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, cfg.densityDissipation);
  blit(dye.write); dye.swap();
}

function render() {
  texUnit = 0; const u = use(P.display, dye.read.texel);
  bindTex(u.uDye, dye.read); blit(null);
}

// ----- splats / input ------------------------------------------------------
function splat(x, y, dx, dy, color) {
  const aspect = canvas.width / canvas.height;
  const radius = (cfg.splatRadius / 100) * (aspect > 1 ? aspect : 1);
  let u;
  texUnit = 0; u = use(P.splat);
  bindTex(u.uTarget, velocity.read);
  gl.uniform1f(u.aspect, aspect); gl.uniform2f(u.point, x, y);
  gl.uniform3f(u.color, dx, dy, 0); gl.uniform1f(u.radius, radius);
  blit(velocity.write); velocity.swap();

  texUnit = 0; u = use(P.splat);
  bindTex(u.uTarget, dye.read);
  gl.uniform1f(u.aspect, aspect); gl.uniform2f(u.point, x, y);
  gl.uniform3f(u.color, color[0], color[1], color[2]); gl.uniform1f(u.radius, radius);
  blit(dye.write); dye.swap();
}
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
let hue = Math.random();
function nextColor() {
  hue = (hue + 0.13 + Math.random() * 0.1) % 1;
  const c = hsv(hue, 0.85, 1); return c.map(x => x * cfg.dyeIntensity);
}

const pointers = new Map();
let lastInput = performance.now();
const aspectDX = d => (canvas.width / canvas.height < 1 ? d * (canvas.width / canvas.height) : d);
const aspectDY = d => (canvas.width / canvas.height > 1 ? d / (canvas.width / canvas.height) : d);

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  pointers.set(e.pointerId, { x, y, dx: 0, dy: 0, moved: false, color: nextColor() });
  splat(x, y, 0, 0, pointers.get(e.pointerId).color.map(c => c * 2));
  lastInput = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  p.dx += aspectDX(x - p.x); p.dy += aspectDY(y - p.y);
  p.x = x; p.y = y; p.moved = true; lastInput = performance.now();
});
const up = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

function applyPointers() {
  for (const p of pointers.values()) {
    if (!p.moved) continue;
    splat(p.x, p.y, p.dx * cfg.splatForce, p.dy * cfg.splatForce, p.color);
    p.dx = p.dy = 0; p.moved = false;
  }
}
function randomSplat(strength = 1) {
  const x = Math.random(), y = Math.random(), a = Math.random() * Math.PI * 2;
  const f = (600 + Math.random() * 900) * strength;
  splat(x, y, Math.cos(a) * f, Math.sin(a) * f, nextColor().map(c => c * 1.5));
}

// Tilt: device gravity pushes the fluid (iOS needs a user gesture to grant access).
const tilt = { on: false, gx: 0, gy: 0 };
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const s = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let gx = a.x, gy = a.y;
  if (s === 90) [gx, gy] = [-a.y, a.x]; else if (s === 270 || s === -90) [gx, gy] = [a.y, -a.x]; else if (s === 180) [gx, gy] = [-a.x, -a.y];
  const k = 1 / 9.8; tilt.gx = gx * k; tilt.gy = gy * k;  // ~[-1, 1], +y is toward the top of the screen
}
if ('DeviceMotionEvent' in window && matchMedia('(pointer: coarse)').matches) {
  const b = $('motion'); b.hidden = false;
  b.onclick = async () => {
    if (tilt.on) { tilt.on = false; window.removeEventListener('devicemotion', onMotion); b.textContent = 'Tilt: off'; return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function' && (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
      window.addEventListener('devicemotion', onMotion); tilt.on = true; b.textContent = 'Tilt: on';
    } catch (_) {}
  };
}
function applyTilt(dt) {
  if (!tilt.on) return;
  const m = Math.hypot(tilt.gx, tilt.gy); if (m < 0.08) return;
  // inject a gentle uniform acceleration through a few wide, invisible velocity splats
  const aspect = canvas.width / canvas.height;
  texUnit = 0; const u = use(P.splat);
  const f = 900 * dt * 60 * cfg.tiltStrength;
  for (const [x, y] of [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.5, 0.5]]) {
    texUnit = 0; bindTex(u.uTarget, velocity.read);
    gl.uniform1f(u.aspect, aspect); gl.uniform2f(u.point, x, y);
    gl.uniform3f(u.color, tilt.gx * f * 0.02, tilt.gy * f * 0.02, 0); gl.uniform1f(u.radius, 0.35);
    blit(velocity.write); velocity.swap();
  }
}

$('clear').onclick = () => { [velocity, dye, pressure].forEach(d => { for (const f of [d.read, d.write]) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.viewport(0, 0, f.w, f.h); gl.clear(gl.COLOR_BUFFER_BIT); } }); };
$('swirl').onclick = e => { cfg.swirl = !cfg.swirl; e.target.textContent = 'Swirl: ' + (cfg.swirl ? 'on' : 'off'); };

window.addEventListener('resize', () => { if (resizeCanvas()) initBuffers(); });

// ----- settings panel --------------------------------------------------------
const SCHEMA = [
  { k: 'curl', label: 'Swirliness (vorticity)', min: 0, max: 60, step: 1 },
  { k: 'velocityDissipation', label: 'Velocity damping', min: 0, max: 4, step: 0.05 },
  { k: 'densityDissipation', label: 'Dye fade', min: 0, max: 4, step: 0.05 },
  { k: 'pressure', label: 'Pressure persistence', min: 0, max: 1, step: 0.01 },
  { k: 'splatRadius', label: 'Brush size', min: 0.05, max: 1, step: 0.01 },
  { k: 'splatForce', label: 'Stir force', min: 500, max: 20000, step: 100 },
  { k: 'dyeIntensity', label: 'Dye amount', min: 0.02, max: 0.6, step: 0.01 },
  { k: 'tiltStrength', label: 'Tilt gravity strength', min: 0, max: 5, step: 0.1 },
  { k: 'maxDpr', label: 'Render scale', min: 0.5, max: 3, step: 0.25, apply: () => { resizeCanvas(); initBuffers(); } },
];
const DEFAULTS = Object.assign({}, cfg);
const KEY = 'fluidCfg';
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in saved) if (k in DEFAULTS) cfg[k] = saved[k]; } catch (_) {}
resizeCanvas(); initBuffers();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} };
const panel = $('panel'), widgets = {};
function addRow(html) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = html; panel.appendChild(d); return d; }
for (const s of SCHEMA) {
  const row = addRow(`<label>${s.label}</label><output></output><input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const show = () => { inp.value = cfg[s.k]; out.textContent = +(+cfg[s.k]).toFixed(2); };
  inp.oninput = () => { cfg[s.k] = +inp.value; out.textContent = +(+inp.value).toFixed(2); if (!s.apply) save(); };
  if (s.apply) inp.onchange = () => { s.apply(); save(); };
  widgets[s.k] = show; show();
}
{
  const r = addRow(`<label>Resolution level</label><output></output><input type="range" min="0" max="${LEVELS.length - 1}" step="1">`);
  const inp = r.querySelector('input'), out = r.querySelector('output');
  const show = () => { inp.value = cfg.level; const L = LEVELS[cfg.level]; out.textContent = `${cfg.level} (sim ${L.sim}, dye ${L.dye})`; };
  inp.oninput = () => { cfg.level = +inp.value; perf.ceiling = LEVELS.length - 1; show(); };
  inp.onchange = () => { initBuffers(); save(); };
  widgets.level = show; show();
  const c = document.createElement('div'); c.className = 'row check';
  c.innerHTML = `<input type="checkbox" id="auto"><label for="auto">Auto-adjust resolution to keep 60 fps</label>`;
  panel.appendChild(c);
  const cb = c.querySelector('input'); cb.checked = cfg.auto;
  cb.onchange = () => { cfg.auto = cb.checked; perf.goodSecs = 0; save(); };
}
{
  const b = document.createElement('button'); b.textContent = 'Reset to defaults';
  b.onclick = () => { Object.assign(cfg, DEFAULTS); perf.ceiling = LEVELS.length - 1; resizeCanvas(); initBuffers();
    for (const k in widgets) widgets[k](); panel.querySelector('#auto').checked = cfg.auto; save(); };
  panel.appendChild(b);
}
$('gear').onclick = () => { document.body.classList.toggle('panel', panel.classList.toggle('open')); };

// ----- adaptive quality ----------------------------------------------------
const perf = { frames: 0, acc: 0, fps: 60, goodSecs: 0, ceiling: LEVELS.length - 1 };
function adapt(rawDt) {
  perf.frames++; perf.acc += rawDt;
  if (perf.acc < 1) return;               // evaluate once per second
  perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0;
  if (!cfg.auto) {}
  else if (perf.fps < 40 && cfg.level > 0) {
    cfg.level--; perf.ceiling = cfg.level; perf.goodSecs = 0; initBuffers();   // never climb back above a level that failed
  } else if (perf.fps > 55 && cfg.level < perf.ceiling) {
    if (++perf.goodSecs >= 3) { cfg.level++; perf.goodSecs = 0; initBuffers(); }
  } else perf.goodSecs = 0;
  if (widgets.level) widgets.level();
  const L = LEVELS[cfg.level];
  $('stats').textContent = `${Math.round(perf.fps)} fps · sim ${L.sim} · dye ${L.dye}`;
}

// ----- main loop -----------------------------------------------------------
let last = performance.now(), nextAuto = last + 400;
for (let i = 0; i < 5; i++) randomSplat(1.5);
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(Math.max(raw, 0.001), 1 / 30);
  if (now > nextAuto && now - lastInput > 4000 && pointers.size === 0) {   // idle: keep it alive
    randomSplat(0.8); nextAuto = now + 1200 + Math.random() * 1500;
  }
  applyPointers(); applyTilt(dt);
  step(dt); render();
  if (raw < 0.5) adapt(raw);              // ignore tab-switch hiccups
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('WebGL context lost. Reload the page.'); });
</script>
</body>
