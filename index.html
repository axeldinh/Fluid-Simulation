<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font: 12px/1 system-ui, sans-serif; color: #fff9; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e;
    border-radius: 999px; padding: 9px 14px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud button:active { background: #ffffff40; }
  #stats { margin-left: auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto; display: none;
    padding: 14px calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #000000c4; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #ffffff22;
    font: 13px/1.2 system-ui, sans-serif; color: #fffd; touch-action: pan-y; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel.open ~ #hud #stats, body.panel #stats { display: none; }
  body.panel #hud { background: linear-gradient(#0000, #000c 60%); }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; }
  #panel .row output { color: #fff9; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 28px; }
  #panel .row.check { grid-template-columns: auto 1fr; align-items: center; }
  #panel button { font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e; border-radius: 999px; padding: 9px 14px; }
  #hud { z-index: 2; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="mode">Mode: Water</button>
  <button id="clear">Reset</button>
  <button id="motion" hidden>Tilt: off</button>
  <button id="swirl">Swirl: on</button>
  <button id="gear">Settings</button>
  <div id="stats"></div>
</div>
<div id="panel"></div>
<div id="msg"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Real-time GPU fluid simulation (Stam "Stable Fluids" + vorticity confinement)
// WebGL2, all state lives in half-float textures. Adaptive resolution keeps it
// at a steady frame rate on phones.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);

function fail(text) {
  const m = $('msg'); m.textContent = text; m.style.display = 'flex';
  throw new Error(text);
}

const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This demo needs WebGL2, which your browser does not support.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('Your GPU cannot render to floating-point textures.');
gl.getExtension('OES_texture_float_linear');

// Quality ladder: [simulation grid, dye grid, pressure iterations]
const LEVELS = [
  { sim: 48,  dye: 256, iter: 10 },
  { sim: 64,  dye: 384, iter: 14 },
  { sim: 96,  dye: 512, iter: 18 },
  { sim: 128, dye: 768, iter: 22 },
  { sim: 192, dye: 1024, iter: 26 },
];
// Two modes share one solver. 'dye' = coloured smoke you splat in. 'water' = a body of water
// (an advected 0..1 fill fraction) that gravity pulls down and that you can slosh, stir, and grow new blobs of.
const PRESETS = {
  dye:   { velocityDissipation: 0.25, densityDissipation: 0.6, pressure: 0.8,  curl: 25, splatRadius: 0.22, splatForce: 6000, dyeIntensity: 0.18 },
  water: { velocityDissipation: 0.05, densityDissipation: 0.5, pressure: 0.97, curl: 2,  splatRadius: 0.4,  splatForce: 3000, dyeIntensity: 0.18 },
};
const cfg = {
  mode: 'water',
  level: 2,
  auto: true,
  ...PRESETS.water,
  gravity: 10,        // water mode: screen-heights per second squared
  ballGrowth: 0.25,   // water mode: how fast a held-down water ball grows (screen heights per second)
  sharpen: 1.06,      // water mode: interface contrast boost per frame
  ink: 0,             // water mode: coloured tracer dye (0 = off, saves GPU time)
  swirl: true,
  tiltStrength: 1,    // multiplier for device-tilt gravity
  maxDpr: 1.5,
};

// ----- shaders -------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPosition;
out vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv, vL, vR, vT, vB;
out vec4 o;
`;
const FRAG = {
  copy: HEAD + `uniform sampler2D uTex; void main(){ o = textureLod(uTex, vUv, 0.0); }`,

  clear: HEAD + `uniform sampler2D uTex; uniform float value;
    void main(){ o = value * texture(uTex, vUv); }`,

  splat: HEAD + `uniform sampler2D uTarget; uniform float aspect; uniform vec3 color;
    uniform vec2 point; uniform float radius;
    void main(){
      vec2 p = vUv - point; p.x *= aspect;
      vec3 s = exp(-dot(p, p) / radius) * color;
      o = vec4(texture(uTarget, vUv).xyz + s, 1.0);
    }`,

  advection: HEAD + `uniform sampler2D uVelocity, uSource; uniform vec2 texelSize; uniform float dt, dissipation;
    void main(){
      vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
      o = textureLod(uSource, coord, 0.0) / (1.0 + dissipation * dt);
    }`,

  divergence: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).x, R = texture(uVelocity, vR).x;
      float T = texture(uVelocity, vT).y, B = texture(uVelocity, vB).y;
      vec2 C = texture(uVelocity, vUv).xy;
      if (vL.x < 0.0) L = -C.x;
      if (vR.x > 1.0) R = -C.x;
      if (vT.y > 1.0) T = -C.y;
      if (vB.y < 0.0) B = -C.y;
      o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
    }`,

  curl: HEAD + `uniform sampler2D uVelocity;
    void main(){
      float L = texture(uVelocity, vL).y, R = texture(uVelocity, vR).y;
      float T = texture(uVelocity, vT).x, B = texture(uVelocity, vB).x;
      o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
    }`,

  vorticity: HEAD + `uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
    void main(){
      float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x;
      float T = texture(uCurl, vT).x, B = texture(uCurl, vB).x;
      float C = texture(uCurl, vUv).x;
      vec2 f = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      f /= length(f) + 0.0001;
      f *= curl * C; f.y *= -1.0;
      vec2 v = texture(uVelocity, vUv).xy + f * dt;
      o = vec4(clamp(v, -1000.0, 1000.0), 0.0, 1.0);
    }`,

  pressure: HEAD + `uniform sampler2D uPressure, uDivergence;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      float d = texture(uDivergence, vUv).x;
      o = vec4((L + R + B + T - d) * 0.25, 0.0, 0.0, 1.0);
    }`,

  // --- multigrid helpers (water mode): residual, restriction, prolongation ---
  residual: HEAD + `uniform sampler2D uPressure, uB;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      float C = texture(uPressure, vUv).x;
      o = vec4(texture(uB, vUv).x - (L + R + T + B - 4.0 * C), 0.0, 0.0, 1.0);
    }`,
  restrict: HEAD + `uniform sampler2D uTex;       // x4: the coarse grid has twice the spacing
    void main(){ o = vec4(4.0 * texture(uTex, vUv).x, 0.0, 0.0, 1.0); }`,
  prolong: HEAD + `uniform sampler2D uP, uE;
    void main(){ o = vec4(texture(uP, vUv).x + texture(uE, vUv).x, 0.0, 0.0, 1.0); }`,

  gradient: HEAD + `uniform sampler2D uPressure, uVelocity;
    void main(){
      float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
      float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
      vec2 v = texture(uVelocity, vUv).xy - 0.5 * vec2(R - L, T - B);
      if (vL.x < 0.0 || vR.x > 1.0) v.x = 0.0;      // solid walls: no flow through the boundary
      if (vB.y < 0.0 || vT.y > 1.0) v.y = 0.0;
      o = vec4(v, 0.0, 1.0);
    }`,

  gravity: HEAD + `uniform sampler2D uVelocity, uWater; uniform vec2 g; uniform float dt;
    void main(){
      vec2 v = texture(uVelocity, vUv).xy + g * dt * textureLod(uWater, vUv, 0.0).x;
      o = vec4(v, 0.0, 1.0);
    }`,

  // Volume bookkeeping: 4 taps per 128x128 cell; R = fill fraction, G = width of the surface band.
  massDown: HEAD + `uniform sampler2D uTex;
    void main(){
      vec2 d = vec2(0.25 / 128.0);
      float c = 0.25 * (clamp(texture(uTex, vUv + vec2( d.x,  d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x,  d.y)).x, 0.0, 1.0)
                      + clamp(texture(uTex, vUv + vec2( d.x, -d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x, -d.y)).x, 0.0, 1.0));
      o = vec4(c, 1.0 - abs(2.0 * c - 1.0), 0.0, 1.0);
    }`,

  // Keeps the water surface crisp and holds the water volume constant: the mean fill (uMass,
  // last mip level) is compared with the target and the surface is nudged out/in just enough
  // to cancel the numerical volume loss/gain of advection.
  sharpen: HEAD + `uniform sampler2D uTex, uMass; uniform float k, target, gain;
    void main(){
      float c = clamp(texture(uTex, vUv).x, 0.0, 1.0);
      vec2 m = textureLod(uMass, vec2(0.5), 7.0).xy;
      vec2 ts = vec2(vR.x - vUv.x, vT.y - vUv.y);
      float cb = 0.0;                                     // 3x3 blur -> a band a couple of texels wide around the surface
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        cb += clamp(texture(uTex, vUv + vec2(float(i), float(j)) * ts).x, 0.0, 1.0);
      float band = 1.0 - abs(2.0 * (cb / 9.0) - 1.0);
      float delta = clamp((target - m.x) * gain / max(m.y, 0.02), -0.3, 0.3);
      o = vec4(clamp((c - 0.5) * k + 0.5 + delta * band, 0.0, 1.0), 0.0, 0.0, 1.0);
    }`,

  // Stamp a solid ball into a field: kind 0 = water fill (set to 1), kind 1 = velocity (set to 0).
  stamp: HEAD + `uniform sampler2D uTex; uniform vec2 point; uniform float aspect, radius, kind;
    void main(){
      vec2 d = vUv - point; d.x *= aspect;
      float inside = 1.0 - smoothstep(radius - 0.006, radius, length(d));
      vec4 t = texture(uTex, vUv);
      o = kind < 0.5 ? vec4(mix(t.x, 1.0, inside), t.yzw) : vec4(t.xy * (1.0 - inside), t.zw);
    }`,

  fill: HEAD + `void main(){ o = vec4(1.0 - smoothstep(0.38, 0.42, vUv.y), 0.0, 0.0, 1.0); }`,

  displayWater: HEAD + `uniform sampler2D uWater, uVelocity, uDye; uniform float velScale, inkOn, aspect; uniform vec3 balls[4];
    float W(vec2 uv){ return textureLod(uWater, uv, 0.0).x; }
    void main(){
      vec2 ts = vec2(vR.x - vUv.x, vT.y - vUv.y);
      float w = W(vUv);
      vec2 s = ts * 3.0;
      vec2 grad = vec2(W(vUv + vec2(s.x, 0.0)) - W(vUv - vec2(s.x, 0.0)),
                       W(vUv + vec2(0.0, s.y)) - W(vUv - vec2(0.0, s.y)));
      // how much water surrounds this pixel -> fake depth shading
      vec2 r = ts * 18.0;
      float d = w + W(vUv + vec2(r.x, 0.0)) + W(vUv - vec2(r.x, 0.0)) + W(vUv + vec2(0.0, r.y)) + W(vUv - vec2(0.0, r.y))
                  + W(vUv + r * 0.7071) + W(vUv - r * 0.7071) + W(vUv + vec2(r.x, -r.y) * 0.7071) + W(vUv + vec2(-r.x, r.y) * 0.7071);
      d /= 9.0;
      float m = smoothstep(0.3, 0.7, w);
      vec3 col = mix(vec3(0.22, 0.66, 0.96), vec3(0.02, 0.12, 0.40), smoothstep(0.35, 1.0, d));
      float sp = length(texture(uVelocity, vUv).xy) / velScale;       // fast water gets foamy
      col += vec3(0.8, 0.95, 1.0) * smoothstep(0.6, 2.0, sp) * 0.5;
      float edge = length(grad);                                      // surface edge: rim light + glint
      vec3 n = normalize(vec3(-grad * 6.0, 1.0));
      float spec = pow(max(dot(n, normalize(vec3(-0.35, 0.55, 0.75))), 0.0), 24.0) * smoothstep(0.02, 0.25, edge);
      col += vec3(0.5, 0.8, 1.0) * smoothstep(0.05, 0.5, edge) * 0.35 + vec3(spec * 0.8);
      if (inkOn > 0.5) col += texture(uDye, vUv).rgb * 2.5;
      vec3 air = mix(vec3(0.03, 0.05, 0.09), vec3(0.09, 0.13, 0.21), vUv.y);
      vec3 c = mix(air, col, m);
      for (int i = 0; i < 4; i++) {                                  // growing water balls being held down
        if (balls[i].z <= 0.0) continue;
        vec2 d = vUv - balls[i].xy; d.x *= aspect;
        float r = length(d), inside = 1.0 - smoothstep(balls[i].z - 0.004, balls[i].z, r);
        float rim = inside * smoothstep(balls[i].z - 0.014, balls[i].z - 0.004, r);
        c = mix(c, vec3(0.30, 0.72, 1.0), inside * 0.8) + vec3(0.6, 0.9, 1.0) * rim * 0.6;
      }
      o = vec4(c, 1.0);
    }`,

  display: HEAD + `uniform sampler2D uDye;
    float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main(){
      vec3 c = texture(uDye, vUv).rgb;
      // cheap relief lighting from the dye's luminance gradient
      float dx = lum(texture(uDye, vR).rgb) - lum(texture(uDye, vL).rgb);
      float dy = lum(texture(uDye, vT).rgb) - lum(texture(uDye, vB).rgb);
      vec3 n = normalize(vec3(-dx, -dy, 0.04));
      float diffuse = clamp(dot(n, normalize(vec3(-0.4, 0.5, 0.8))) * 0.5 + 0.5, 0.6, 1.2);
      c *= diffuse;
      c = 1.0 - exp(-1.6 * max(c, 0.0));          // soft tone map
      c = pow(c, vec3(1.0 / 1.1));
      o = vec4(c, 1.0);
    }`,
};

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(s));
  return s;
}
const vs = compile(gl.VERTEX_SHADER, VERT);
function program(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPosition');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const P = {};
for (const k in FRAG) P[k] = program(FRAG[k]);

// full-screen quad
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function blit(target) {
  if (target) { gl.viewport(0, 0, target.w, target.h); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo); }
  else { gl.viewport(0, 0, canvas.width, canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function use(prog, texel) {
  gl.useProgram(prog.p);
  if (texel) gl.uniform2f(prog.u.texelSize, texel[0], texel[1]);
  return prog.u;
}
let texUnit = 0;
function bindTex(loc, fb) { gl.activeTexture(gl.TEXTURE0 + texUnit); gl.bindTexture(gl.TEXTURE_2D, fb.tex); gl.uniform1i(loc, texUnit++); }

// ----- framebuffers --------------------------------------------------------
function makeFBO(w, h, filter, mips = false) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_NEAREST : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('Float framebuffer unsupported.');
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (mips) { gl.bindTexture(gl.TEXTURE_2D, tex); gl.generateMipmap(gl.TEXTURE_2D); }
  return { tex, fbo, w, h, texel: [1 / w, 1 / h], destroy() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); } };
}
function genMips(fb) { gl.bindTexture(gl.TEXTURE_2D, fb.tex); gl.generateMipmap(gl.TEXTURE_2D); }
function makeDouble(w, h, filter, mips = false) {
  const d = { read: makeFBO(w, h, filter, mips), write: makeFBO(w, h, filter, mips),
    swap() { const t = this.read; this.read = this.write; this.write = t; },
    destroy() { this.read.destroy(); this.write.destroy(); } };
  return d;
}
// Resample an existing double buffer into new dimensions (used when quality changes).
function resizeDouble(old, w, h, filter, mips = false) {
  const n = makeDouble(w, h, filter, mips);
  if (old) {
    texUnit = 0; const u = use(P.copy); bindTex(u.uTex, old.read); blit(n.read);
    old.destroy();
  }
  return n;
}

let velocity, dye, water, massTex, divergence, curl, pressure, mg = [];
function gridSize(res) {
  let a = canvas.width / canvas.height; if (a < 1) a = 1 / a;
  const lo = Math.round(res), hi = Math.round(res * a);
  return canvas.width > canvas.height ? [hi, lo] : [lo, hi];
}
function initBuffers() {
  const L = LEVELS[cfg.level];
  const [sw, sh] = gridSize(L.sim), [dw, dh] = gridSize(L.dye);
  velocity = resizeDouble(velocity, sw, sh, gl.LINEAR);
  dye = resizeDouble(dye, dw, dh, gl.LINEAR);
  const fresh = !water;
  water = resizeDouble(water, dw, dh, gl.LINEAR);
  if (!massTex) massTex = makeFBO(128, 128, gl.LINEAR, true);
  if (fresh) fillWater();
  [divergence, curl].forEach(f => f && f.destroy());
  if (pressure) pressure.destroy();
  divergence = makeFBO(sw, sh, gl.NEAREST);
  curl = makeFBO(sw, sh, gl.NEAREST);
  pressure = makeDouble(sw, sh, gl.NEAREST);
  buildMultigrid(sw, sh);
}
// Multigrid pressure solver. Plain Jacobi needs ~N^2 sweeps to settle a hydrostatic pressure field,
// which is why water would otherwise drain/compress. Coarse grids carry the long-range pressure
// cheaply; level 0 reuses the normal pressure/divergence buffers.
function buildMultigrid(w, h) {
  mg.forEach((l, i) => { if (i > 0) { l.p.destroy(); l.b.destroy(); } l.r.destroy(); });
  mg = [{ w, h, p: pressure, b: divergence, r: makeFBO(w, h, gl.LINEAR) }];
  while (mg.length < 5 && Math.min(w, h) > 12) {
    w = Math.ceil(w / 2); h = Math.ceil(h / 2);
    mg.push({ w, h, p: makeDouble(w, h, gl.LINEAR), b: makeFBO(w, h, gl.LINEAR), r: makeFBO(w, h, gl.LINEAR) });
  }
}
function smooth(l, n) {
  const L = mg[l], u = use(P.pressure, [1 / L.w, 1 / L.h]);
  for (let i = 0; i < n; i++) {
    texUnit = 0; bindTex(u.uDivergence, L.b); bindTex(u.uPressure, L.p.read);
    blit(L.p.write); L.p.swap();
  }
}
function vcycle(l, pre, post) {
  const L = mg[l];
  if (l === mg.length - 1) { smooth(l, 30); return; }
  smooth(l, pre);
  texUnit = 0; let u = use(P.residual, [1 / L.w, 1 / L.h]); bindTex(u.uPressure, L.p.read); bindTex(u.uB, L.b); blit(L.r);
  const C = mg[l + 1];
  texUnit = 0; u = use(P.restrict); bindTex(u.uTex, L.r); blit(C.b);
  for (const f of [C.p.read, C.p.write]) { gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.viewport(0, 0, f.w, f.h); gl.clear(gl.COLOR_BUFFER_BIT); }
  vcycle(l + 1, pre, post);
  texUnit = 0; u = use(P.prolong); bindTex(u.uP, L.p.read); bindTex(u.uE, C.p.read); blit(L.p.write); L.p.swap();
  smooth(l, post);
}
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, cfg.maxDpr);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr)), h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (w === canvas.width && h === canvas.height) return false;
  canvas.width = w; canvas.height = h; return true;
}
const FILL_LEVEL = 0.4;        // fraction of the tank filled at start (matches the 'fill' shader)
let waterTarget = FILL_LEVEL;  // the water volume the solver keeps constant (re-measured when you drop a ball)
function fillWater() {
  texUnit = 0; use(P.fill); blit(water.read);
  waterTarget = FILL_LEVEL;
}
resizeCanvas(); initBuffers();

// ----- simulation step -----------------------------------------------------
function step(dt) {
  const L = LEVELS[cfg.level];
  const vt = velocity.read.texel;
  let u;

  texUnit = 0; u = use(P.curl, vt); bindTex(u.uVelocity, velocity.read); blit(curl);

  texUnit = 0; u = use(P.vorticity, vt);
  bindTex(u.uVelocity, velocity.read); bindTex(u.uCurl, curl);
  gl.uniform1f(u.curl, cfg.swirl ? cfg.curl : 0); gl.uniform1f(u.dt, dt);
  blit(velocity.write); velocity.swap();

  const isWater = cfg.mode === 'water';
  const iters = L.iter;
  if (isWater) {
    const g = cfg.gravity * velocity.read.h * (tilt.on ? cfg.tiltStrength : 1);
    texUnit = 0; u = use(P.gravity);
    bindTex(u.uVelocity, velocity.read); bindTex(u.uWater, water.read);
    gl.uniform2f(u.g, grav.x * g, grav.y * g); gl.uniform1f(u.dt, dt);
    blit(velocity.write); velocity.swap();
  }

  texUnit = 0; u = use(P.divergence, vt); bindTex(u.uVelocity, velocity.read); blit(divergence);

  texUnit = 0; u = use(P.clear); bindTex(u.uTex, pressure.read); gl.uniform1f(u.value, cfg.pressure);
  blit(pressure.write); pressure.swap();

  if (isWater) { vcycle(0, 3, 3); vcycle(0, 2, 2); }
  else {
    u = use(P.pressure, vt);
    for (let i = 0; i < iters; i++) {
      texUnit = 0; bindTex(u.uDivergence, divergence); bindTex(u.uPressure, pressure.read);
      blit(pressure.write); pressure.swap();
    }
  }

  texUnit = 0; u = use(P.gradient, vt); bindTex(u.uPressure, pressure.read); bindTex(u.uVelocity, velocity.read);
  blit(velocity.write); velocity.swap();

  texUnit = 0; u = use(P.advection, vt);
  bindTex(u.uVelocity, velocity.read); bindTex(u.uSource, velocity.read);
  gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, cfg.velocityDissipation);
  blit(velocity.write); velocity.swap();

  if (!isWater || cfg.ink > 0) {
    texUnit = 0; u = use(P.advection, vt);
    bindTex(u.uVelocity, velocity.read); bindTex(u.uSource, dye.read);
    gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, cfg.densityDissipation);
    blit(dye.write); dye.swap();
  }

  if (isWater) {
    texUnit = 0; u = use(P.advection, vt);
    bindTex(u.uVelocity, velocity.read); bindTex(u.uSource, water.read);
    gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, 0);
    blit(water.write); water.swap();
    // advection smears the surface and loses volume; re-sharpen and re-balance the volume.
    // First measure the current volume: downsample into a 128x128 power-of-two texture whose
    // mip chain's last level is then exactly the mean (no CPU readback).
    texUnit = 0; u = use(P.massDown); bindTex(u.uTex, water.read); blit(massTex);
    gl.bindTexture(gl.TEXTURE_2D, massTex.tex); gl.generateMipmap(gl.TEXTURE_2D);
    texUnit = 0; u = use(P.sharpen, water.read.texel); bindTex(u.uTex, water.read); bindTex(u.uMass, massTex);
    gl.uniform1f(u.k, cfg.sharpen); gl.uniform1f(u.target, waterTarget); gl.uniform1f(u.gain, 0.3);
    blit(water.write); water.swap();
  }
}

function render() {
  if (cfg.mode === 'water') {
    texUnit = 0; const w = use(P.displayWater, water.read.texel);
    bindTex(w.uWater, water.read); bindTex(w.uVelocity, velocity.read); bindTex(w.uDye, dye.read);
    const bd = new Float32Array(12); let bi = 0;
    for (const p of pointers.values()) if (p.hold && p.hold.on && p.hold.r > 0 && bi < 4) { bd.set([p.x, p.y, p.hold.r], bi * 3); bi++; }
    gl.uniform3fv(w['balls[0]'], bd); gl.uniform1f(w.aspect, canvas.width / canvas.height);
    gl.uniform1f(w.velScale, velocity.read.h); gl.uniform1f(w.inkOn, cfg.ink > 0 ? 1 : 0);
    blit(null); return;
  }
  texUnit = 0; const u = use(P.display, dye.read.texel);
  bindTex(u.uDye, dye.read); blit(null);
}

// Drop a solid ball of water into the simulation, replacing whatever was there (and its motion).
function stampBall(x, y, r) {
  const aspect = canvas.width / canvas.height;
  for (const [kind, target] of [[0, water], [1, velocity]]) {
    texUnit = 0; const u = use(P.stamp); bindTex(u.uTex, target.read);
    gl.uniform2f(u.point, x, y); gl.uniform1f(u.aspect, aspect); gl.uniform1f(u.radius, r); gl.uniform1f(u.kind, kind);
    blit(target.write); target.swap();
  }
  // The volume changed, so re-measure it and make that the new volume to conserve.
  texUnit = 0; use(P.massDown); bindTex(P.massDown.u.uTex, water.read); blit(massTex);
  try {
    gl.bindFramebuffer(gl.FRAMEBUFFER, massTex.fbo);
    const a = new Float32Array(128 * 128 * 4); gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, a);
    let sum = 0; for (let i = 0; i < a.length; i += 4) sum += a[i];
    waterTarget = Math.min(0.9, sum / (128 * 128));
  } catch (_) { waterTarget = Math.min(0.9, waterTarget + Math.PI * r * r / aspect * 0.5); }
}

// ----- splats / input ------------------------------------------------------
function splatInto(target, x, y, a, b, c, radius) {
  texUnit = 0; const u = use(P.splat);
  bindTex(u.uTarget, target.read);
  gl.uniform1f(u.aspect, canvas.width / canvas.height); gl.uniform2f(u.point, x, y);
  gl.uniform3f(u.color, a, b, c); gl.uniform1f(u.radius, radius);
  blit(target.write); target.swap();
}
function splatRadius() { const aspect = canvas.width / canvas.height; return (cfg.splatRadius / 100) * (aspect > 1 ? aspect : 1); }
function splat(x, y, dx, dy, color) {
  const radius = splatRadius();
  splatInto(velocity, x, y, dx, dy, 0, radius);
  if (cfg.mode !== 'water') splatInto(dye, x, y, color[0], color[1], color[2], radius);
  else if (cfg.ink > 0) splatInto(dye, x, y, color[0] * cfg.ink * 5, color[1] * cfg.ink * 5, color[2] * cfg.ink * 5, radius);
}
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
let hue = Math.random();
function nextColor() {
  hue = (hue + 0.13 + Math.random() * 0.1) % 1;
  const c = hsv(hue, 0.85, 1); return c.map(x => x * cfg.dyeIntensity);
}

const pointers = new Map();
let lastInput = performance.now();
const aspectDX = d => (canvas.width / canvas.height < 1 ? d * (canvas.width / canvas.height) : d);
const aspectDY = d => (canvas.width / canvas.height > 1 ? d / (canvas.width / canvas.height) : d);

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  const p = { x, y, dx: 0, dy: 0, moved: false, color: nextColor(), hold: null };
  pointers.set(e.pointerId, p);
  if (cfg.mode === 'water') p.hold = { on: true, r: 0, cx: e.clientX, cy: e.clientY };   // hold still to grow a water ball
  else splat(x, y, 0, 0, p.color.map(c => c * 2));
  lastInput = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  p.dx += aspectDX(x - p.x); p.dy += aspectDY(y - p.y);
  p.x = x; p.y = y; p.moved = true; lastInput = performance.now();
  if (p.hold && p.hold.on && Math.hypot(e.clientX - p.hold.cx, e.clientY - p.hold.cy) > 14) p.hold.on = false;   // dragging = stirring, not a ball
});
const up = e => {
  const p = pointers.get(e.pointerId);
  if (p && p.hold && p.hold.on && p.hold.r > 0.01 && e.type === 'pointerup') stampBall(p.x, p.y, p.hold.r);
  pointers.delete(e.pointerId);
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

const BALL_MAX = 0.22;    // largest ball radius, in screen heights
function applyPointers(dt) {
  for (const p of pointers.values()) {
    if (p.hold && p.hold.on) {            // still holding: grow the ball, don't stir
      p.hold.r = Math.min(BALL_MAX, p.hold.r + cfg.ballGrowth * dt);
      p.dx = p.dy = 0; p.moved = false; continue;
    }
    if (!p.moved) continue;
    splat(p.x, p.y, p.dx * cfg.splatForce, p.dy * cfg.splatForce, p.color);
    p.dx = p.dy = 0; p.moved = false;
  }
}
function randomSplat(strength = 1) {
  const x = Math.random(), y = Math.random(), a = Math.random() * Math.PI * 2;
  const f = (600 + Math.random() * 900) * strength;
  splat(x, y, Math.cos(a) * f, Math.sin(a) * f, nextColor().map(c => c * 1.5));
}

// Tilt: the phone's gravity vector drives the fluid (iOS needs a user gesture to grant access).
// tilt.gx/gy is the direction gravity pulls in screen space (+y = up the screen), magnitude <= ~1.
const tilt = { on: false, gx: 0, gy: -1 };
const grav = { x: 0, y: -1 };      // smoothed gravity direction used by the water solver
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const s = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let gx = a.x, gy = a.y;
  if (s === 90) [gx, gy] = [-a.y, a.x]; else if (s === 270 || s === -90) [gx, gy] = [a.y, -a.x]; else if (s === 180) [gx, gy] = [-a.x, -a.y];
  // Android reports the reaction to gravity (+y when upright); iOS reports the opposite sign.
  const k = (IOS ? 1 : -1) / 9.8; tilt.gx = gx * k; tilt.gy = gy * k;
}
function updateGravity(dt) {
  let tx = 0, ty = -1;
  if (tilt.on) { tx = tilt.gx; ty = tilt.gy; const m = Math.hypot(tx, ty); if (m > 1) { tx /= m; ty /= m; } }
  const f = Math.min(1, dt * 10); grav.x += (tx - grav.x) * f; grav.y += (ty - grav.y) * f;
}
if ('DeviceMotionEvent' in window && matchMedia('(pointer: coarse)').matches) {
  const b = $('motion'); b.hidden = false;
  b.onclick = async () => {
    if (tilt.on) { tilt.on = false; window.removeEventListener('devicemotion', onMotion); b.textContent = 'Tilt: off'; return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function' && (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
      window.addEventListener('devicemotion', onMotion); tilt.on = true; b.textContent = 'Tilt: on';
    } catch (_) {}
  };
}
function applyTilt(dt) {
  if (!tilt.on || cfg.mode === 'water') return;     // water mode uses tilt as the gravity direction instead
  const m = Math.hypot(tilt.gx, tilt.gy); if (m < 0.08) return;
  // inject a gentle uniform acceleration through a few wide, invisible velocity splats
  const f = 900 * dt * 60 * cfg.tiltStrength;
  for (const [x, y] of [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.5, 0.5]])
    splatInto(velocity, x, y, tilt.gx * f * 0.02, tilt.gy * f * 0.02, 0, 0.35);
}

$('clear').onclick = () => { [velocity, dye, pressure, water].forEach(d => { for (const f of [d.read, d.write]) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.viewport(0, 0, f.w, f.h); gl.clear(gl.COLOR_BUFFER_BIT); } }); fillWater(); };
function setMode(m, fromPreset = true) {
  cfg.mode = m; if (fromPreset) Object.assign(cfg, PRESETS[m]);
  $('mode').textContent = 'Mode: ' + (m === 'water' ? 'Water' : 'Dye');
  for (const k in widgets) widgets[k]();
}
$('mode').onclick = () => { setMode(cfg.mode === 'water' ? 'dye' : 'water'); save(); };
$('swirl').onclick = e => { cfg.swirl = !cfg.swirl; e.target.textContent = 'Swirl: ' + (cfg.swirl ? 'on' : 'off'); };

window.addEventListener('resize', () => { if (resizeCanvas()) initBuffers(); });

// ----- settings panel --------------------------------------------------------
const SCHEMA = [
  { k: 'curl', label: 'Swirliness (vorticity)', min: 0, max: 60, step: 1 },
  { k: 'velocityDissipation', label: 'Velocity damping', min: 0, max: 4, step: 0.05 },
  { k: 'densityDissipation', label: 'Dye fade', min: 0, max: 4, step: 0.05 },
  { k: 'pressure', label: 'Pressure persistence', min: 0, max: 1, step: 0.01 },
  { k: 'splatRadius', label: 'Brush size', min: 0.05, max: 1, step: 0.01 },
  { k: 'splatForce', label: 'Stir force', min: 500, max: 20000, step: 100 },
  { k: 'dyeIntensity', label: 'Dye amount', min: 0.02, max: 0.6, step: 0.01 },
  { k: 'gravity', label: 'Water gravity', min: 0, max: 40, step: 0.5 },
  { k: 'ballGrowth', label: 'Water ball growth speed', min: 0.05, max: 1, step: 0.05 },
  { k: 'ink', label: 'Ink trace (water mode)', min: 0, max: 1, step: 0.05 },
  { k: 'tiltStrength', label: 'Tilt gravity strength', min: 0, max: 5, step: 0.1 },
  { k: 'maxDpr', label: 'Render scale', min: 0.5, max: 3, step: 0.25, apply: () => { resizeCanvas(); initBuffers(); } },
];
const DEFAULTS = Object.assign({}, cfg);
const KEY = 'fluidCfg2';
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in saved) if (k in DEFAULTS) cfg[k] = saved[k]; } catch (_) {}
resizeCanvas(); initBuffers();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} };
const panel = $('panel'), widgets = {};
function addRow(html) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = html; panel.appendChild(d); return d; }
for (const s of SCHEMA) {
  const row = addRow(`<label>${s.label}</label><output></output><input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const show = () => { inp.value = cfg[s.k]; out.textContent = +(+cfg[s.k]).toFixed(2); };
  inp.oninput = () => { cfg[s.k] = +inp.value; out.textContent = +(+inp.value).toFixed(2); if (!s.apply) save(); };
  if (s.apply) inp.onchange = () => { s.apply(); save(); };
  widgets[s.k] = show; show();
}
{
  const r = addRow(`<label>Resolution level</label><output></output><input type="range" min="0" max="${LEVELS.length - 1}" step="1">`);
  const inp = r.querySelector('input'), out = r.querySelector('output');
  const show = () => { inp.value = cfg.level; const L = LEVELS[cfg.level]; out.textContent = `${cfg.level} (sim ${L.sim}, dye ${L.dye})`; };
  inp.oninput = () => { cfg.level = +inp.value; perf.ceiling = LEVELS.length - 1; show(); };
  inp.onchange = () => { initBuffers(); save(); };
  widgets.level = show; show();
  const c = document.createElement('div'); c.className = 'row check';
  c.innerHTML = `<input type="checkbox" id="auto"><label for="auto">Auto-adjust resolution to keep 60 fps</label>`;
  panel.appendChild(c);
  const cb = c.querySelector('input'); cb.checked = cfg.auto;
  cb.onchange = () => { cfg.auto = cb.checked; perf.goodSecs = 0; save(); };
}
{
  const b = document.createElement('button'); b.textContent = 'Reset to defaults';
  b.onclick = () => { Object.assign(cfg, DEFAULTS); perf.ceiling = LEVELS.length - 1; resizeCanvas(); initBuffers();
    setMode(cfg.mode, false); panel.querySelector('#auto').checked = cfg.auto; save(); };
  panel.appendChild(b);
}
setMode(cfg.mode, false);
$('gear').onclick = () => { document.body.classList.toggle('panel', panel.classList.toggle('open')); };

// ----- adaptive quality ----------------------------------------------------
const perf = { frames: 0, acc: 0, fps: 60, goodSecs: 0, ceiling: LEVELS.length - 1 };
function adapt(rawDt) {
  perf.frames++; perf.acc += rawDt;
  if (perf.acc < 1) return;               // evaluate once per second
  perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0;
  if (!cfg.auto) {}
  else if (perf.fps < 40 && cfg.level > 0) {
    cfg.level--; perf.ceiling = cfg.level; perf.goodSecs = 0; initBuffers();   // never climb back above a level that failed
  } else if (perf.fps > 55 && cfg.level < perf.ceiling) {
    if (++perf.goodSecs >= 3) { cfg.level++; perf.goodSecs = 0; initBuffers(); }
  } else perf.goodSecs = 0;
  if (widgets.level) widgets.level();
  const L = LEVELS[cfg.level];
  $('stats').textContent = `${Math.round(perf.fps)} fps · sim ${L.sim} · dye ${L.dye}`;
}

// ----- main loop -----------------------------------------------------------
let last = performance.now(), nextAuto = last + 400;
if (cfg.mode === 'dye') for (let i = 0; i < 5; i++) randomSplat(1.5);
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(Math.max(raw, 0.001), 1 / 30);
  if (cfg.mode === 'dye' && now > nextAuto && now - lastInput > 4000 && pointers.size === 0) {   // idle: keep it alive
    randomSplat(0.8); nextAuto = now + 1200 + Math.random() * 1500;
  }
  updateGravity(dt); applyPointers(dt); applyTilt(dt);
  step(dt); render();
  if (raw < 0.5) adapt(raw);              // ignore tab-switch hiccups
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('WebGL context lost. Reload the page.'); });
</script>
</body>
</html>
