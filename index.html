<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font: 12px/1 system-ui, sans-serif; color: #fff9; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e;
    border-radius: 999px; padding: 9px 14px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud button:active { background: #ffffff40; }
  #stats { margin-left: auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto; display: none;
    padding: 14px calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #000000c4; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #ffffff22;
    font: 13px/1.2 system-ui, sans-serif; color: #fffd; touch-action: pan-y; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel.open ~ #hud #stats, body.panel #stats { display: none; }
  body.panel #hud { background: linear-gradient(#0000, #000c 60%); }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; }
  #panel .row output { color: #fff9; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 28px; }
  #panel .row.check { grid-template-columns: auto 1fr; align-items: center; }
  #panel button { font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e; border-radius: 999px; padding: 9px 14px; }
  #hud { z-index: 2; }
  #scenes { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(110px + env(safe-area-inset-bottom)); display: none;
    flex-direction: column; gap: 6px; padding: 10px; z-index: 3; border-radius: 14px; background: #000000b0;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid #ffffff22; font: 13px/1.2 system-ui, sans-serif; }
  #scenes.open { display: flex; }
  #scenes button { font: inherit; text-align: left; color: #fffd; background: #ffffff14; border: 1px solid #ffffff22; border-radius: 10px; padding: 10px 14px; }
  #scenes button small { display: block; color: #fff8; font-size: 11px; margin-top: 3px; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="clear">Reset</button>
  <button id="sceneBtn">Scene: Tank</button>
  <button id="tool">Tool: Water</button>
  <button id="paddle">Wave maker: off</button>
  <button id="tap">Tap: off</button>
  <button id="motion" hidden>Tilt: off</button>
  <button id="gear">Settings</button>
  <div id="stats"></div>
</div>
<div id="scenes"></div>
<div id="panel"></div>
<div id="msg"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Real-time water in a tank, in the browser (WebGL2). Two algorithms: a GPU two-phase grid solver and
// CPU FLIP particles, selectable in Settings. Adaptive resolution keeps it at a steady frame rate on phones.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);

function fail(text) {
  const m = $('msg'); m.textContent = text; m.style.display = 'flex';
  throw new Error(text);
}

const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This demo needs WebGL2, which your browser does not support.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('Your GPU cannot render to floating-point textures.');
gl.getExtension('OES_texture_float_linear');
const CAN_F32 = !!gl.getExtension('EXT_color_buffer_float');   // 32-bit pressure needed for large water/air density ratios

// Quality ladder: simulation grid (short side, in cells) and resolution of the water-surface texture
const LEVELS = [
  { sim: 48, tex: 256 },
  { sim: 64, tex: 384 },
  { sim: 96, tex: 512 },
  { sim: 128, tex: 768 },
  { sim: 192, tex: 1024 },
];
// A tank of water: an advected 0..1 fill fraction on a staggered grid with a two-phase pressure solve ("grid"),
// or FLIP particles. Gravity pulls it down; you can slosh, stir it and grow new blobs of water.
const ALGOS = ['grid', 'flip', 'apic'], ALGO_NAMES = { grid: 'Grid', flip: 'FLIP', apic: 'APIC Pro' };
const cfg = {
  level: 2,
  auto: true,
  velocityDissipation: 2,   // grid water: velocity damping per second
  pressure: 0.9,            // grid water: share of last step's pressure reused as the starting guess
  splatRadius: 0.4,         // brush size, percent of screen height
  splatForce: 3000,
  gravity: 30,        // water mode: screen heights per second² (≈ Earth gravity for a 30 cm tank)
  ballGrowth: 0.25,   // water mode: how fast a held-down water ball grows (screen heights per second)
  waterAlgo: 'grid',  // 'grid' = Eulerian two-phase solver on the GPU, 'flip' = FLIP particles (CPU), 'apic' = APIC + PCG + ghost-fluid particles (CPU)
  flipRatio: 0.9,     // FLIP: 0 = pure PIC (smooth, damped), 1 = pure FLIP (lively, noisier)
  flipIters: 40,      // FLIP: pressure solver sweeps per step (APIC Pro: maximum conjugate-gradient iterations)
  density: 100,       // water mode: water density relative to air (real water ≈ 800; 100 stays calmer)
  tiltStrength: 1,    // multiplier for device-tilt gravity
  paddleAmp: 0.015,   // wave maker: half the stroke of the piston, in screen heights
  paddlePeriod: 0.3,  // wave maker: seconds per stroke cycle
  tapSpeed: 1.0,      // tap: outflow speed, screen heights per second
  jetSpeed: 2.5,      // fountain pump: jet speed, screen heights per second
  wallSize: 0.016,    // radius of the wall brush, screen heights
  maxDpr: 1.5,
};

const isParticles = () => cfg.waterAlgo !== 'grid';
// Obstacles / scene state (shared by every solver). SOL.mat holds a material per mask texel:
// 0 empty, 1 drawn wall (concrete), 2 sand, 3 rock, 4 glass, 5 metal.
const SOL = { w: 0, h: 0, mat: null, tex: null, dirty: true };
const PADDLE = { on: false, t: 0 };                     // piston wave maker on the left wall
const TAP = { on: false, halfWidth: 0.012, y0: 0.9, y1: 0.96 };   // nozzle near the top centre (uv y range)
const scene = { name: 'tank', jet: null };              // jet: fountain pump region (uv box) or null
let tool = 'water';                                     // 'water' (stir / hold for a ball), 'wall', 'erase'

// ----- shaders -------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPosition;
out vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
in vec2 vUv, vL, vR, vT, vB;
out vec4 o;
`;
// Shared GLSL: sampling the staggered face velocities at an arbitrary point p (in cell units).
const VELSRC = `uniform sampler2D uU, uV; uniform vec2 gridSize;
vec2 uvU(vec2 p){ return vec2((p.x + 0.5) / (gridSize.x + 1.0), p.y / gridSize.y); }
vec2 uvV(vec2 p){ return vec2(p.x / gridSize.x, (p.y + 0.5) / (gridSize.y + 1.0)); }
vec2 velAt(vec2 p){ return vec2(texture(uU, uvU(p)).x, texture(uV, uvV(p)).x); }
`;
const FRAG = {
  copy: HEAD + `uniform sampler2D uTex; void main(){ o = textureLod(uTex, vUv, 0.0); }`,

  clear: HEAD + `uniform sampler2D uTex; uniform float value;
    void main(){ o = value * texture(uTex, vUv); }`,

  // fine pressure += bilinearly interpolated coarse correction (manual, so 32-bit float textures work unfiltered)
  prolong: HEAD + `uniform sampler2D uP, uE;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), nf = textureSize(uP, 0), nc = textureSize(uE, 0);
      vec2 q = (vec2(c) + 0.5) * vec2(nc) / vec2(nf) - 0.5;
      ivec2 i0 = ivec2(floor(q)); vec2 f = q - vec2(i0);
      ivec2 a = clamp(i0, ivec2(0), nc - 1), b = clamp(i0 + 1, ivec2(0), nc - 1);
      float e = mix(mix(texelFetch(uE, ivec2(a.x, a.y), 0).x, texelFetch(uE, ivec2(b.x, a.y), 0).x, f.x),
                    mix(texelFetch(uE, ivec2(a.x, b.y), 0).x, texelFetch(uE, ivec2(b.x, b.y), 0).x, f.x), f.y);
      o = vec4(texelFetch(uP, c, 0).x + e, 0.0, 0.0, 1.0);
    }`,

  // Volume bookkeeping: 4 taps per 128x128 cell; R = fill fraction, G = width of the surface band.
  massDown: HEAD + `uniform sampler2D uTex;
    void main(){
      vec2 d = vec2(0.25 / 128.0);
      float c = 0.25 * (clamp(texture(uTex, vUv + vec2( d.x,  d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x,  d.y)).x, 0.0, 1.0)
                      + clamp(texture(uTex, vUv + vec2( d.x, -d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x, -d.y)).x, 0.0, 1.0));
      o = vec4(c, 1.0 - abs(2.0 * c - 1.0), 0.0, 1.0);
    }`,

  // particle density -> fill fraction. The surface stays at density 0.5; small gaps between particles inside the
  // water (density dips to ~0.7) still count as full water instead of showing up as a mottled texture.
  phiClamp: HEAD + `uniform sampler2D uTex;
    void main(){ o = vec4(smoothstep(0.3, 0.7, texture(uTex, vUv).x), 0.0, 0.0, 1.0); }`,

  // ===== Water: staggered (MAC) grid + two-phase pressure projection =====
  // u lives on vertical cell faces, v on horizontal ones, pressure and the fill fraction in cells.
  // ===== Grid surface: a level set psi = signed distance to the water surface, in screen heights (< 0 inside) =====
  // Advected with MacCormack (second-order, with a limiter), kept a distance function by PDE re-initialisation,
  // and turned into a fill fraction with a smooth step only when needed: a crisp surface that doesn't smear.
  fillLS: HEAD + `uniform float band, level;
    void main(){ o = vec4(clamp(vUv.y - level, -band, band), 0.0, 0.0, 1.0); }`,
  stampLS: HEAD + `uniform sampler2D uTex; uniform vec2 point; uniform float aspect, radius;
    void main(){ vec2 d = vUv - point; d.x *= aspect; o = vec4(min(texture(uTex, vUv).x, length(d) - radius), 0.0, 0.0, 1.0); }`,
  // fill fraction for drawing / volume; water hidden inside solids doesn't count, so drawing a wall into the pool
  // displaces the water (the volume controller then lifts the surface by exactly that much)
  lsToFill: HEAD + `uniform sampler2D uTex, uMask; uniform float eps, paddleUV;
    void main(){
      float f = 1.0 - smoothstep(-eps, eps, texture(uTex, vUv).x);
      float sol = vUv.x < paddleUV ? 1.0 : smoothstep(0.3, 0.7, texture(uMask, vUv).x);
      o = vec4(f * (1.0 - sol), 0.0, 0.0, 1.0);
    }`,
  // the tap: a box of water at the nozzle
  stampBoxLS: HEAD + `uniform sampler2D uTex; uniform vec4 box; uniform float aspect;
    void main(){
      vec2 p = vec2(vUv.x * aspect, vUv.y), lo = vec2(box.x * aspect, box.y), hi = vec2(box.z * aspect, box.w);
      vec2 q = abs(p - 0.5 * (lo + hi)) - 0.5 * (hi - lo);
      float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
      o = vec4(min(texture(uTex, vUv).x, sd), 0.0, 0.0, 1.0);
    }`,
  // fill fraction per simulation cell (for the densities), with the surface smoothed over about two cells
  phiDown: HEAD + `uniform sampler2D uPsi; uniform vec2 cell; uniform float eps;
    void main(){
      float s = 0.0;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        s += 1.0 - smoothstep(-eps, eps, textureLod(uPsi, vUv + vec2(float(i), float(j)) * cell * 0.33, 0.0).x);
      o = vec4(s / 9.0, 0.0, 0.0, 1.0);
    }`,
  // MacCormack: forward + backward semi-Lagrangian steps give an error estimate that is subtracted, then the result is
  // clamped to the values it was interpolated from (no new extrema). The volume error measured last frame is fixed by
  // moving the whole surface along its normal (with a distance function that is just a constant shift).
  maccormack: HEAD + VELSRC + `uniform sampler2D uPsi, uFwd, uBack, uMass; uniform float dt, target, band, maxShift; uniform vec2 texSize;
    void main(){
      vec2 p = vUv * gridSize;
      vec2 pm = clamp(p - 0.5 * dt * velAt(p), vec2(0.0), gridSize);
      vec2 p0 = clamp(p - dt * velAt(pm), vec2(0.0), gridSize);
      float c = texture(uFwd, vUv).x + 0.5 * (texture(uPsi, vUv).x - texture(uBack, vUv).x);
      vec2 t = p0 / gridSize * texSize - 0.5; ivec2 i0 = ivec2(floor(t)), mx = ivec2(texSize) - 1;
      float a = texelFetch(uPsi, clamp(i0, ivec2(0), mx), 0).x, b = texelFetch(uPsi, clamp(i0 + ivec2(1, 0), ivec2(0), mx), 0).x;
      float e = texelFetch(uPsi, clamp(i0 + ivec2(0, 1), ivec2(0), mx), 0).x, d = texelFetch(uPsi, clamp(i0 + ivec2(1, 1), ivec2(0), mx), 0).x;
      c = clamp(c, min(min(a, b), min(e, d)), max(max(a, b), max(e, d)));
      vec2 m = textureLod(uMass, vec2(0.5), 7.0).xy;
      float err = target - m.x; err = abs(err) < 0.001 ? 0.0 : err - sign(err) * 0.001;
      float shift = clamp(0.5 * err * (0.5 / 128.0) / max(m.y, 1e-4), -maxShift, maxShift);
      o = vec4(clamp(c - shift, -band, band), 0.0, 0.0, 1.0);
    }`,
  // one step of  psi_t + sign(psi0) (|grad psi| - 1) = 0  (Godunov upwinding) keeps psi a signed distance
  redistance: HEAD + `uniform sampler2D uPsi, uPsi0; uniform vec2 h; uniform float band;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uPsi, 0) - 1;
      float p = texelFetch(uPsi, c, 0).x, p0 = texelFetch(uPsi0, c, 0).x;
      float L = texelFetch(uPsi, clamp(c - ivec2(1, 0), ivec2(0), n), 0).x, R = texelFetch(uPsi, clamp(c + ivec2(1, 0), ivec2(0), n), 0).x;
      float B = texelFetch(uPsi, clamp(c - ivec2(0, 1), ivec2(0), n), 0).x, T = texelFetch(uPsi, clamp(c + ivec2(0, 1), ivec2(0), n), 0).x;
      float a = (p - L) / h.x, b = (R - p) / h.x, e = (p - B) / h.y, d = (T - p) / h.y, gx, gy;
      if (p0 > 0.0) { gx = max(max(a, 0.0) * max(a, 0.0), min(b, 0.0) * min(b, 0.0)); gy = max(max(e, 0.0) * max(e, 0.0), min(d, 0.0) * min(d, 0.0)); }
      else          { gx = max(min(a, 0.0) * min(a, 0.0), max(b, 0.0) * max(b, 0.0)); gy = max(min(e, 0.0) * min(e, 0.0), max(d, 0.0) * max(d, 0.0)); }
      float hm = min(h.x, h.y), s = p0 / sqrt(p0 * p0 + hm * hm);
      o = vec4(clamp(p - 0.5 * hm * s * (sqrt(gx + gy) - 1.0), -band, band), 0.0, 0.0, 1.0);
    }`,

  // Face coefficients beta = 1/density between neighbouring cells (0 at solid walls).
  beta: HEAD + `uniform sampler2D uPhi, uSolid; uniform float rhoA, paddleX;     // water density = 1, air density = rhoA (= 1 / ratio)
    float rho(ivec2 c){ return mix(rhoA, 1.0, clamp(texelFetch(uPhi, c, 0).x, 0.0, 1.0)); }
    bool solid(ivec2 c){ return texelFetch(uSolid, c, 0).x > 0.5 || float(c.x) + 0.5 < paddleX; }
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uPhi, 0);
      if (solid(c)) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }      // obstacles take no part in the pressure solve
      float r = rho(c);
      float bx = (c.x < n.x - 1 && !solid(c + ivec2(1, 0))) ? 2.0 / (r + rho(c + ivec2(1, 0))) : 0.0;
      float by = (c.y < n.y - 1 && !solid(c + ivec2(0, 1))) ? 2.0 / (r + rho(c + ivec2(0, 1))) : 0.0;
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  divMAC: HEAD + `uniform sampler2D uU, uV;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      o = vec4(texelFetch(uU, c + ivec2(1, 0), 0).x - texelFetch(uU, c, 0).x
             + texelFetch(uV, c + ivec2(0, 1), 0).x - texelFetch(uV, c, 0).x, 0.0, 0.0, 1.0);
    }`,

  // damped Jacobi on  sum_f beta_f (p_n - p) = div
  jacobiW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float sum = b.x + bL + b.y + bB, s = 0.0;
      if (sum <= 0.0) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }     // a cell walled in on all sides (inside an obstacle)
      if (b.x > 0.0) s += b.x * texelFetch(uP, c + ivec2(1, 0), 0).x;
      if (bL > 0.0)  s += bL  * texelFetch(uP, c - ivec2(1, 0), 0).x;
      if (b.y > 0.0) s += b.y * texelFetch(uP, c + ivec2(0, 1), 0).x;
      if (bB > 0.0)  s += bB  * texelFetch(uP, c - ivec2(0, 1), 0).x;
      float pj = (s - texelFetch(uD, c, 0).x) / max(sum, 1e-6);
      o = vec4(p + 0.8 * (pj - p), 0.0, 0.0, 1.0);
    }`,

  residualW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float f = 0.0;
      if (b.x + bL + b.y + bB <= 0.0) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
      if (b.x > 0.0) f += b.x * (texelFetch(uP, c + ivec2(1, 0), 0).x - p);
      if (bL > 0.0)  f += bL  * (texelFetch(uP, c - ivec2(1, 0), 0).x - p);
      if (b.y > 0.0) f += b.y * (texelFetch(uP, c + ivec2(0, 1), 0).x - p);
      if (bB > 0.0)  f += bB  * (texelFetch(uP, c - ivec2(0, 1), 0).x - p);
      o = vec4(texelFetch(uD, c, 0).x - f, 0.0, 0.0, 1.0);
    }`,

  restrictResW: HEAD + `uniform sampler2D uR;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uR, 0);
      float s = 0.0;
      for (int i = 0; i < 2; i++) for (int j = 0; j < 2; j++) {
        ivec2 f = c + ivec2(i, j);
        if (f.x < n.x && f.y < n.y) s += texelFetch(uR, f, 0).x;
      }
      o = vec4(s, 0.0, 0.0, 1.0);
    }`,

  restrictBetaW: HEAD + `uniform sampler2D uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uB, 0);
      float bx = 0.0, by = 0.0;
      ivec2 fx = c + ivec2(1, 0);
      if (fx.x < n.x) { float a = texelFetch(uB, fx, 0).x; float b2 = fx.y + 1 < n.y ? texelFetch(uB, fx + ivec2(0, 1), 0).x : a; bx = 0.5 * (a + b2); }
      ivec2 fy = c + ivec2(0, 1);
      if (fy.y < n.y) { float a = texelFetch(uB, fy, 0).y; float b2 = fy.x + 1 < n.x ? texelFetch(uB, fy + ivec2(1, 0), 0).y : a; by = 0.5 * (a + b2); }
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  // Pressure update of the face velocities. Air is ~800x lighter than water, so tiny pressure errors in
  // the air become large air velocities; slow-moving faces that touch no water are therefore damped away
  // (fast ones, e.g. the air around a falling ball, are left alone).
  projectU: HEAD + `uniform sampler2D uU, uP, uB, uPhi; uniform float airCap;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uP, 0);
      if (c.x <= 0 || c.x >= n.x) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }

        float alpha = smoothstep(0.35, 0.65, cov);

// Particle sprites for FLIP: each particle adds a small gaussian blob of density.
const PVERT = `#version 300 es
in vec2 aPos; uniform float size;
void main(){ gl_Position = vec4(aPos * 2.0 - 1.0, 0.0, 1.0); gl_PointSize = size; }`;
const PFRAG = `#version 300 es
precision highp float; out vec4 o; uniform float weight;
void main(){
  vec2 d = (gl_PointCoord - 0.5) * 2.0; float r2 = dot(d, d);
  if (r2 > 1.0) discard;
  o = vec4(exp(-4.5 * r2) * weight, 0.0, 0.0, 1.0);     // sprite edge = 3 sigma

const P = {};
for (const k in FRAG) P[k] = program(FRAG[k]);
P.particles = program(PFRAG, compile(gl.VERTEX_SHADER, PVERT));

// full-screen quad
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function blit(target) {

  else { gl.viewport(0, 0, canvas.width, canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }

}
function use(prog, texel) {

// ----- framebuffers --------------------------------------------------------
function makeFBO(w, h, filter, mips = false, f32 = false, r16 = false) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  else if (f32) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);

    swap() { const t = this.read; this.read = this.write; this.write = t; },

function gridSize(res) {
  let a = canvas.width / canvas.height; if (a < 1) a = 1 / a;
  const lo = Math.round(res), hi = Math.round(res * a);
  return canvas.width > canvas.height ? [hi, lo] : [lo, hi];
}
function initBuffers() {
  const L = LEVELS[cfg.level];

  lset = resizeDouble(lset, dw, dh, gl.LINEAR, false, false, true);     // psi is stored in screen heights, so it survives a resolution change

  if (!massTex) massTex = makeFBO(128, 128, gl.LINEAR, true);

// ----- water solver ----------------------------------------------------------
// Staggered (MAC) grid, two phases. Pressure is solved from  div(beta grad p) = div u  with
// beta = 1/density, so water (heavy) and air (light) behave like themselves: water falls and
// slides as one mass and air simply gets out of the way. A multigrid V-cycle with the same

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const p = { x, y, dx: 0, dy: 0, moved: false, hold: null, draw: false };

  const fp = floorPressure(algo, dt), ratio = algo === 'grid' ? Math.min(cfg.density, CAN_F32 ? 2000 : 30) : Infinity;
  const hc = h * fp.cells, expectedP = fp.g * fp.dt * (hc + (fp.cells - hc) / ratio);
  // 2. sloshing: tilt gravity for a moment, put it back, then watch the surface swing between the walls
  progress(`${algo}: sloshing…`);
  const eta = [], vol = [];
  for (let i = 0; i < 18; i++) { grav.x = 0.12; grav.y = -Math.sqrt(1 - 0.12 * 0.12); run(dt); }
  grav.x = 0; grav.y = -1;
  for (let i = 0; i < 200; i++) {
    run(dt); const c = benchColumns(); eta.push((c.left - c.right) / 2); vol.push(c.mean);
    if (i % 10 === 9) { progress(`${algo}: sloshing ${Math.round(i / 2)}%`); await yieldUI(); }
  }
  const k = Math.PI / aspect, g = cfg.gravity, kh = k * h;
  const w2one = g * k * Math.tanh(kh);
  const ra = 1 / (algo === 'grid' ? ratio : 1e9), w2two = g * k * (1 - ra) / (1 / Math.tanh(kh) + ra / Math.tanh(k * (1 - h)));
  const Tth = 2 * Math.PI / Math.sqrt(algo === 'grid' ? w2two : w2one), Tms = periodFromSeries(eta, dt);
  const amp = a => Math.max(...a.map(Math.abs));
  return {
    algorithm: algo, tankWidthInHeights: +aspect.toFixed(3),
    level: { expected: FILL_LEVEL, measured: +h.toFixed(4) },
    restSpeed: +speedRest.toFixed(4),
    bottomPressure: { expected: +expectedP.toFixed(2), measured: +fp.value.toFixed(2) },
    sloshPeriodSeconds: { theory: +Tth.toFixed(3), singleFluidTheory: +(2 * Math.PI / Math.sqrt(w2one)).toFixed(3), measured: Tms === null ? null : +Tms.toFixed(3) },
    sloshDecay: { firstQuarter: +amp(eta.slice(0, 50)).toFixed(4), lastQuarter: +amp(eta.slice(150)).toFixed(4) },
    volumeDriftPercent: +(100 * (vol[vol.length - 1] - vol[0]) / vol[0]).toFixed(2),
  };
}
async function runTheory(progress = () => {}) {
  const saved = { algo: cfg.waterAlgo, auto: cfg.auto };
  saved.scene = scene.name; loadScene('tank');
  bench.on = true; cfg.auto = false;
  const out = { when: new Date().toISOString(), level: cfg.level, settings: { gravity: cfg.gravity, density: cfg.density, flipRatio: cfg.flipRatio, flipIters: cfg.flipIters }, results: {} };
  try { for (const algo of ALGOS) out.results[algo] = await theoryAlgo(algo, progress); }
  finally { setAlgo(saved.algo); cfg.auto = saved.auto; bench.on = false; loadScene(saved.scene); }
  window.theoryResult = out; return out;
}
function formatTheory(r) {
  const e = (th, m) => (th && m !== null && isFinite(m)) ? ((100 * (m - th) / th) >= 0 ? '+' : '') + (100 * (m - th) / th).toFixed(1) + '%' : 'n/a';
  const f = x => x === null || x === undefined ? 'n/a' : x;
  const rows = [];
  for (const algo of ALGOS) {
    const a = r.results[algo];
    rows.push(`${ALGO_NAMES[algo].toUpperCase()}  (tank ${a.tankWidthInHeights} heights wide)`,
      `  water level      expected ${a.level.expected}  measured ${a.level.measured}  ${e(a.level.expected, a.level.measured)}`,
      `  bottom pressure  expected ${a.bottomPressure.expected}  measured ${a.bottomPressure.measured}  ${e(a.bottomPressure.expected, a.bottomPressure.measured)}`,
      `  sloshing period  theory ${a.sloshPeriodSeconds.theory} s  measured ${f(a.sloshPeriodSeconds.measured)} s  ${e(a.sloshPeriodSeconds.theory, a.sloshPeriodSeconds.measured)}`,
      `  slosh amplitude  first ${a.sloshDecay.firstQuarter} → last ${a.sloshDecay.lastQuarter} heights`,
      `  speed at rest    ${a.restSpeed} heights/s (ideal 0)`,
      `  volume drift     ${a.volumeDriftPercent}% (ideal 0)`, '');
  }
  return rows.join('\n');
}
function formatBench(r) {
  const R = r.results, row = (label, get) => label.padEnd(24) + ALGOS.map(a => String(get(R[a])).padStart(11)).join('');
  const n = v => v === null ? '>9s' : v;
  return [`GPU: ${r.gpu}`, `Level ${r.level}, canvas ${r.canvas.join('x')}, ${r.cores ?? '?'} cores`, '',
    row('', () => '').replace(/\s+$/, '') + '', ''.padEnd(24) + ALGOS.map(a => ALGO_NAMES[a].padStart(11)).join(''),
    row('max fps (GPU-synced)', x => x.maxFps),
    row('ms/frame avg', x => x.msPerFrame.avg), row('  simulation', x => x.stepMsAvg), row('  drawing', x => x.drawMsAvg),
    row('ms/frame p95', x => x.msPerFrame.p95), row('ms/frame worst', x => x.msPerFrame.worst),
    row('particles', x => x.particles ?? '-'),
    row('settle time (s)', x => n(x.settleSeconds)), row('speed at end (h/s)', x => x.speedAtEnd), row('volume drift %', x => x.volumeDriftPercent)].join('\n');
}
{
  const box = document.createElement('div'); box.className = 'row'; box.style.cssText = 'display:block';
  box.innerHTML = `<button id="bench">Run benchmark (~30 s)</button> <button id="sweep">Sweep all levels (~40 s)</button> <button id="theory">Compare with theory (~20 s)</button> <button id="benchCopy" hidden>Copy results</button>
    <pre id="benchOut" style="white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;color:#fffc;margin:10px 0 0"></pre>
    <small style="color:#fff8">Runs a scripted splash on both algorithms at the current resolution level with a fixed time step. Keep the tab in front and leave the phone alone.</small>`;
  const reset = panel.lastChild; panel.insertBefore(box, reset);
  const out = box.querySelector('#benchOut'), run = box.querySelector('#bench'), sweep = box.querySelector('#sweep'), theory = box.querySelector('#theory'), copy = box.querySelector('#benchCopy');
  let lastJSON = null;
  const go = (btn, job, fmt) => async () => {
    run.disabled = sweep.disabled = theory.disabled = true; copy.hidden = true;
    try { const r = await job(m => { out.textContent = m; }); out.textContent = fmt(r); lastJSON = r; copy.hidden = false; console.log('benchmark', JSON.stringify(r)); }
    catch (e) { out.textContent = 'Benchmark failed: ' + e.message; }
    run.disabled = sweep.disabled = theory.disabled = false;
  };
  run.onclick = go(run, runBenchmark, formatBench);
  sweep.onclick = go(sweep, runSweep, formatSweep);
  theory.onclick = go(theory, runTheory, formatTheory);
  copy.onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(lastJSON, null, 2)); copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy results', 1500); } catch (_) {} };
}
// ?bench in the URL runs it automatically and leaves the numbers in window.benchResult (handy for CI / comparing devices)
if (/[?&]theory\b/.test(location.search)) setTimeout(() => runTheory(m => { document.title = m; }).then(r => { document.title = 'theory done'; console.log('theory', JSON.stringify(r)); }), 500);
if (/[?&]sweep\b/.test(location.search)) setTimeout(() => runSweep(m => { document.title = m; }).then(r => { document.title = 'sweep done'; console.log('sweep', JSON.stringify(r)); }), 500);
if (/[?&]bench\b/.test(location.search)) setTimeout(() => runBenchmark(m => { document.title = m; }).then(r => { document.title = 'bench done'; console.log('benchmark', JSON.stringify(r)); }), 500);

// ----- main loop -----------------------------------------------------------
loadScene('tank');
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(Math.max(raw, 0.001), 1 / 30);
  if (bench.on) { requestAnimationFrame(frame); return; }          // the benchmark drives the simulation itself
  updateSolids();
  if (PADDLE.on) PADDLE.t += dt;
  if (TAP.on && waterVolume() > 0.7) { TAP.on = false; syncSceneButtons(); }   // stop before the tank overflows
  updateGravity(dt); applyPointers(dt);
  if (isParticles()) stepFlip(dt); else stepWater(dt);
  render();
  if (raw < 0.5) adapt(raw);              // ignore tab-switch hiccups
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('WebGL context lost. Reload the page.'); });
</script>
