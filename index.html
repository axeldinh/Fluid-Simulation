<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font: 12px/1 system-ui, sans-serif; color: #fff9; pointer-events: none; }
  #hud button { pointer-events: auto; font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e;
    border-radius: 999px; padding: 9px 14px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud button:active { background: #ffffff40; }
  #stats { margin-left: auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto; display: none;
    padding: 14px calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #000000c4; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #ffffff22;
    font: 13px/1.2 system-ui, sans-serif; color: #fffd; touch-action: pan-y; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel.open ~ #hud #stats, body.panel #stats { display: none; }
  body.panel #hud { background: linear-gradient(#0000, #000c 60%); }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; }
  #panel .row output { color: #fff9; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 28px; }
  #panel .row.check { grid-template-columns: auto 1fr; align-items: center; }
  #panel button { font: inherit; color: #fffc; background: #ffffff1f; border: 1px solid #ffffff2e; border-radius: 999px; padding: 9px 14px; }
  #hud { z-index: 2; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="clear">Reset</button>
  <button id="motion" hidden>Tilt: off</button>
  <button id="gear">Settings</button>
  <div id="stats"></div>
</div>
<div id="panel"></div>
<div id="msg"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Real-time water in a tank, in the browser (WebGL2). Two algorithms: a GPU two-phase grid solver and
// CPU FLIP particles, selectable in Settings. Adaptive resolution keeps it at a steady frame rate on phones.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);

function fail(text) {
  const m = $('msg'); m.textContent = text; m.style.display = 'flex';
  throw new Error(text);
}

const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This demo needs WebGL2, which your browser does not support.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('Your GPU cannot render to floating-point textures.');
gl.getExtension('OES_texture_float_linear');
const CAN_F32 = !!gl.getExtension('EXT_color_buffer_float');   // 32-bit pressure needed for large water/air density ratios

// Quality ladder: simulation grid (short side, in cells) and resolution of the water-surface texture
const LEVELS = [
  { sim: 48, tex: 256 },
  { sim: 64, tex: 384 },
  { sim: 96, tex: 512 },
  { sim: 128, tex: 768 },
  { sim: 192, tex: 1024 },
];
// A tank of water: an advected 0..1 fill fraction on a staggered grid with a two-phase pressure solve ("grid"),
// or FLIP particles. Gravity pulls it down; you can slosh, stir it and grow new blobs of water.
const cfg = {
  level: 2,
  auto: true,
  velocityDissipation: 2,   // grid water: velocity damping per second
  pressure: 0.9,            // grid water: share of last step's pressure reused as the starting guess
  splatRadius: 0.4,         // brush size, percent of screen height
  splatForce: 3000,
  gravity: 30,        // water mode: screen heights per second² (≈ Earth gravity for a 30 cm tank)
  ballGrowth: 0.25,   // water mode: how fast a held-down water ball grows (screen heights per second)
  sharpen: 1.0,       // grid water: interface contrast boost per frame (only applied where water moves fast). Anything above 1.0 made the resting pool slowly start to boil in tests, so it stays off
  waterAlgo: 'grid',  // 'grid' = Eulerian two-phase solver on the GPU, 'flip' = FLIP particles (CPU)
  flipRatio: 0.9,     // FLIP: 0 = pure PIC (smooth, damped), 1 = pure FLIP (lively, noisier)
  flipIters: 40,      // FLIP: pressure solver sweeps per step
  density: 100,       // water mode: water density relative to air (real water ≈ 800; 100 stays calmer)
  tiltStrength: 1,    // multiplier for device-tilt gravity
  maxDpr: 1.5,
};

// ----- shaders -------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPosition;
out vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
in vec2 vUv, vL, vR, vT, vB;
out vec4 o;
`;
// Shared GLSL: sampling the staggered face velocities at an arbitrary point p (in cell units).
const VELSRC = `uniform sampler2D uU, uV; uniform vec2 gridSize;
vec2 uvU(vec2 p){ return vec2((p.x + 0.5) / (gridSize.x + 1.0), p.y / gridSize.y); }
vec2 uvV(vec2 p){ return vec2(p.x / gridSize.x, (p.y + 0.5) / (gridSize.y + 1.0)); }
vec2 velAt(vec2 p){ return vec2(texture(uU, uvU(p)).x, texture(uV, uvV(p)).x); }
`;
const FRAG = {
  copy: HEAD + `uniform sampler2D uTex; void main(){ o = textureLod(uTex, vUv, 0.0); }`,

  clear: HEAD + `uniform sampler2D uTex; uniform float value;
    void main(){ o = value * texture(uTex, vUv); }`,

  // fine pressure += bilinearly interpolated coarse correction (manual, so 32-bit float textures work unfiltered)
  prolong: HEAD + `uniform sampler2D uP, uE;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), nf = textureSize(uP, 0), nc = textureSize(uE, 0);
      vec2 q = (vec2(c) + 0.5) * vec2(nc) / vec2(nf) - 0.5;
      ivec2 i0 = ivec2(floor(q)); vec2 f = q - vec2(i0);
      ivec2 a = clamp(i0, ivec2(0), nc - 1), b = clamp(i0 + 1, ivec2(0), nc - 1);
      float e = mix(mix(texelFetch(uE, ivec2(a.x, a.y), 0).x, texelFetch(uE, ivec2(b.x, a.y), 0).x, f.x),
                    mix(texelFetch(uE, ivec2(a.x, b.y), 0).x, texelFetch(uE, ivec2(b.x, b.y), 0).x, f.x), f.y);
      o = vec4(texelFetch(uP, c, 0).x + e, 0.0, 0.0, 1.0);
    }`,

  // Volume bookkeeping: 4 taps per 128x128 cell; R = fill fraction, G = width of the surface band.
  massDown: HEAD + `uniform sampler2D uTex;
    void main(){
      vec2 d = vec2(0.25 / 128.0);
      float c = 0.25 * (clamp(texture(uTex, vUv + vec2( d.x,  d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x,  d.y)).x, 0.0, 1.0)
                      + clamp(texture(uTex, vUv + vec2( d.x, -d.y)).x, 0.0, 1.0) + clamp(texture(uTex, vUv + vec2(-d.x, -d.y)).x, 0.0, 1.0));
      o = vec4(c, 1.0 - abs(2.0 * c - 1.0), 0.0, 1.0);
    }`,

  // Keeps the water surface crisp and holds the water volume constant: the mean fill (uMass,
  // last mip level) is compared with the target and the surface is nudged out/in just enough
  // to cancel the numerical volume loss/gain of advection.
  sharpen: HEAD + VELSRC + `uniform sampler2D uTex, uMass; uniform float k, target, gain;
    void main(){
      float c = clamp(texture(uTex, vUv).x, 0.0, 1.0);
      vec2 m = textureLod(uMass, vec2(0.5), 7.0).xy;
      vec2 ts = vec2(vR.x - vUv.x, vT.y - vUv.y);
      float cb = 0.0;                                     // 3x3 blur -> a band a couple of texels wide around the surface
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        cb += clamp(texture(uTex, vUv + vec2(float(i), float(j)) * ts).x, 0.0, 1.0);
      float band = 1.0 - abs(2.0 * (cb / 9.0) - 1.0);
      float err = target - m.x; err = abs(err) < 0.004 ? 0.0 : err - sign(err) * 0.004;   // dead band: don't make a resting surface breathe
      float delta = clamp(err * gain / max(m.y, 0.02), -0.3, 0.3);
      // only sharpen where the water is actually moving: at rest, sharpening amplifies tiny wobbles into a boil
      float sp = length(velAt(vUv * gridSize)) / gridSize.y;
      float kk = 1.0 + (k - 1.0) * smoothstep(0.15, 0.6, sp);
      o = vec4(clamp((c - 0.5) * kk + 0.5 + delta * band, 0.0, 1.0), 0.0, 0.0, 1.0);
    }`,

  // Stamp a solid ball of water (fill fraction -> 1) into the water field.
  stampPhi: HEAD + `uniform sampler2D uTex; uniform vec2 point; uniform float aspect, radius;
    void main(){
      vec2 d = vUv - point; d.x *= aspect;
      float inside = 1.0 - smoothstep(radius - 0.006, radius, length(d));
      vec4 t = texture(uTex, vUv);
      o = vec4(mix(t.x, 1.0, inside), t.yzw);
    }`,

  phiClamp: HEAD + `uniform sampler2D uTex;
    void main(){ o = vec4(clamp(texture(uTex, vUv).x, 0.0, 1.0), 0.0, 0.0, 1.0); }`,

  fill: HEAD + `void main(){ o = vec4(1.0 - smoothstep(0.39, 0.41, vUv.y), 0.0, 0.0, 1.0); }`,

  // ===== Water: staggered (MAC) grid + two-phase pressure projection =====
  // u lives on vertical cell faces, v on horizontal ones, pressure and the fill fraction in cells.
  phiDown: HEAD + `uniform sampler2D uWater; uniform vec2 cell;
    void main(){
      float s = 0.0;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
        s += clamp(textureLod(uWater, vUv + vec2(float(i), float(j)) * cell * 0.33, 0.0).x, 0.0, 1.0);
      o = vec4(s / 9.0, 0.0, 0.0, 1.0);
    }`,

  // Face coefficients beta = 1/density between neighbouring cells (0 at solid walls).
  beta: HEAD + `uniform sampler2D uPhi; uniform float rhoA;     // water density = 1, air density = rhoA (= 1 / ratio)
    float rho(ivec2 c){ return mix(rhoA, 1.0, clamp(texelFetch(uPhi, c, 0).x, 0.0, 1.0)); }
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uPhi, 0);
      float r = rho(c);
      float bx = c.x < n.x - 1 ? 2.0 / (r + rho(c + ivec2(1, 0))) : 0.0;
      float by = c.y < n.y - 1 ? 2.0 / (r + rho(c + ivec2(0, 1))) : 0.0;
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  divMAC: HEAD + `uniform sampler2D uU, uV;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      o = vec4(texelFetch(uU, c + ivec2(1, 0), 0).x - texelFetch(uU, c, 0).x
             + texelFetch(uV, c + ivec2(0, 1), 0).x - texelFetch(uV, c, 0).x, 0.0, 0.0, 1.0);
    }`,

  // damped Jacobi on  sum_f beta_f (p_n - p) = div
  jacobiW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float sum = b.x + bL + b.y + bB, s = 0.0;
      if (b.x > 0.0) s += b.x * texelFetch(uP, c + ivec2(1, 0), 0).x;
      if (bL > 0.0)  s += bL  * texelFetch(uP, c - ivec2(1, 0), 0).x;
      if (b.y > 0.0) s += b.y * texelFetch(uP, c + ivec2(0, 1), 0).x;
      if (bB > 0.0)  s += bB  * texelFetch(uP, c - ivec2(0, 1), 0).x;
      float pj = (s - texelFetch(uD, c, 0).x) / max(sum, 1e-6);
      o = vec4(p + 0.8 * (pj - p), 0.0, 0.0, 1.0);
    }`,

  residualW: HEAD + `uniform sampler2D uP, uD, uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      float p = texelFetch(uP, c, 0).x;
      vec2 b = texelFetch(uB, c, 0).xy;
      float bL = c.x > 0 ? texelFetch(uB, c - ivec2(1, 0), 0).x : 0.0;
      float bB = c.y > 0 ? texelFetch(uB, c - ivec2(0, 1), 0).y : 0.0;
      float f = 0.0;
      if (b.x > 0.0) f += b.x * (texelFetch(uP, c + ivec2(1, 0), 0).x - p);
      if (bL > 0.0)  f += bL  * (texelFetch(uP, c - ivec2(1, 0), 0).x - p);
      if (b.y > 0.0) f += b.y * (texelFetch(uP, c + ivec2(0, 1), 0).x - p);
      if (bB > 0.0)  f += bB  * (texelFetch(uP, c - ivec2(0, 1), 0).x - p);
      o = vec4(texelFetch(uD, c, 0).x - f, 0.0, 0.0, 1.0);
    }`,

  restrictResW: HEAD + `uniform sampler2D uR;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uR, 0);
      float s = 0.0;
      for (int i = 0; i < 2; i++) for (int j = 0; j < 2; j++) {
        ivec2 f = c + ivec2(i, j);
        if (f.x < n.x && f.y < n.y) s += texelFetch(uR, f, 0).x;
      }
      o = vec4(s, 0.0, 0.0, 1.0);
    }`,

  restrictBetaW: HEAD + `uniform sampler2D uB;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy) * 2, n = textureSize(uB, 0);
      float bx = 0.0, by = 0.0;
      ivec2 fx = c + ivec2(1, 0);
      if (fx.x < n.x) { float a = texelFetch(uB, fx, 0).x; float b2 = fx.y + 1 < n.y ? texelFetch(uB, fx + ivec2(0, 1), 0).x : a; bx = 0.5 * (a + b2); }
      ivec2 fy = c + ivec2(0, 1);
      if (fy.y < n.y) { float a = texelFetch(uB, fy, 0).y; float b2 = fy.x + 1 < n.x ? texelFetch(uB, fy + ivec2(1, 0), 0).y : a; by = 0.5 * (a + b2); }
      o = vec4(bx, by, 0.0, 1.0);
    }`,

  // Pressure update of the face velocities. Air is ~800x lighter than water, so tiny pressure errors in
  // the air become large air velocities; slow-moving faces that touch no water are therefore damped away
  // (fast ones, e.g. the air around a falling ball, are left alone).
  projectU: HEAD + `uniform sampler2D uU, uP, uB, uPhi; uniform float airCap;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uP, 0);
      if (c.x <= 0 || c.x >= n.x) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
      float b = texelFetch(uB, c - ivec2(1, 0), 0).x;
      float u = texelFetch(uU, c, 0).x - b * (texelFetch(uP, c, 0).x - texelFetch(uP, c - ivec2(1, 0), 0).x);
      float w = 0.5 * (texelFetch(uPhi, c, 0).x + texelFetch(uPhi, c - ivec2(1, 0), 0).x);
      float air = 1.0 - smoothstep(0.02, 0.3, w);
      u = mix(u, clamp(u, -airCap, airCap), air);                       // light air can't go faster than a few screen heights per second
      o = vec4(u * max(1.0 - air, smoothstep(30.0, 150.0, abs(u))), 0.0, 0.0, 1.0);
    }`,
  projectV: HEAD + `uniform sampler2D uV, uP, uB, uPhi; uniform float airCap;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy), n = textureSize(uP, 0);
      if (c.y <= 0 || c.y >= n.y) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
      float b = texelFetch(uB, c - ivec2(0, 1), 0).y;
      float v = texelFetch(uV, c, 0).x - b * (texelFetch(uP, c, 0).x - texelFetch(uP, c - ivec2(0, 1), 0).x);
      float w = 0.5 * (texelFetch(uPhi, c, 0).x + texelFetch(uPhi, c - ivec2(0, 1), 0).x);
      float air = 1.0 - smoothstep(0.02, 0.3, w);
      v = mix(v, clamp(v, -airCap, airCap), air);
      o = vec4(v * max(1.0 - air, smoothstep(30.0, 150.0, abs(v))), 0.0, 0.0, 1.0);
    }`,

  // Semi-Lagrangian advection (midpoint backtrace) of the face velocities by themselves.
  advectFaces: HEAD + VELSRC + `uniform float dt, damp, kind;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      vec2 p = kind < 0.5 ? vec2(float(c.x), float(c.y) + 0.5) : vec2(float(c.x) + 0.5, float(c.y));
      vec2 pm = clamp(p - 0.5 * dt * velAt(p), vec2(0.0), gridSize);
      vec2 p0 = clamp(p - dt * velAt(pm), vec2(0.0), gridSize);
      float v = kind < 0.5 ? texture(uU, uvU(p0)).x : texture(uV, uvV(p0)).x;
      bool wall = kind < 0.5 ? (c.x == 0 || c.x == int(gridSize.x)) : (c.y == 0 || c.y == int(gridSize.y));
      o = vec4(wall ? 0.0 : v / (1.0 + damp * dt), 0.0, 0.0, 1.0);
    }`,

  forceFaces: HEAD + `uniform sampler2D uTex; uniform vec2 gridSize; uniform float acc, kind;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      bool wall = kind < 0.5 ? (c.x == 0 || c.x == int(gridSize.x)) : (c.y == 0 || c.y == int(gridSize.y));
      o = vec4(wall ? 0.0 : texelFetch(uTex, c, 0).x + acc, 0.0, 0.0, 1.0);
    }`,

  // Gaussian push (amount > 0 adds velocity) or, with radius mode, a solid ball that zeroes motion.
  splatFaces: HEAD + `uniform sampler2D uTex; uniform vec2 gridSize, point; uniform float aspect, radius, kind, amount, stamp;
    void main(){
      ivec2 c = ivec2(gl_FragCoord.xy);
      vec2 pos = kind < 0.5 ? vec2(float(c.x) / gridSize.x, (float(c.y) + 0.5) / gridSize.y)
                            : vec2((float(c.x) + 0.5) / gridSize.x, float(c.y) / gridSize.y);
      vec2 d = pos - point; d.x *= aspect;
      bool wall = kind < 0.5 ? (c.x == 0 || c.x == int(gridSize.x)) : (c.y == 0 || c.y == int(gridSize.y));
      float v = texelFetch(uTex, c, 0).x;
      if (stamp > 0.5) v *= 1.0 - (1.0 - smoothstep(radius - 0.006, radius, length(d)));
      else v += amount * exp(-dot(d, d) / radius);
      o = vec4(wall ? 0.0 : v, 0.0, 0.0, 1.0);
    }`,

  advectPhi: HEAD + VELSRC + `uniform sampler2D uSource; uniform float dt;
    void main(){
      vec2 p = vUv * gridSize;
      vec2 pm = clamp(p - 0.5 * dt * velAt(p), vec2(0.0), gridSize);
      vec2 p0 = clamp(p - dt * velAt(pm), vec2(0.0), gridSize);
      o = textureLod(uSource, p0 / gridSize, 0.0);
    }`,

  displayWater: HEAD + VELSRC + `uniform sampler2D uWater; uniform vec2 gdir; uniform float aspect, time, velScale; uniform vec3 balls[4];
    float W(vec2 uv){ return textureLod(uWater, uv, 0.0).x; }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    // the tank's back wall: soft gradient, faint tile grid (this is what the water refracts)
    vec3 backdrop(vec2 uv){
      vec2 q = vec2(uv.x * aspect, uv.y);
      vec3 base = mix(vec3(0.05, 0.07, 0.10), vec3(0.20, 0.25, 0.32), smoothstep(0.0, 1.0, uv.y * 0.7 + 0.15));
      vec2 g = abs(fract(q * 7.0) - 0.5);
      base += 0.06 * smoothstep(0.47, 0.5, max(g.x, g.y));
      return base * (0.8 + 0.3 * smoothstep(1.1, 0.2, length(uv - vec2(0.5, 0.6))));
    }
    void main(){
      vec2 ts = vec2(vR.x - vUv.x, vT.y - vUv.y);
      vec2 up = vec2(-gdir.x / aspect, -gdir.y);                       // uv direction pointing away from gravity
      float w = W(vUv);
      float s = (w * 4.0 + W(vUv + vec2(ts.x * 1.5, 0.0)) + W(vUv - vec2(ts.x * 1.5, 0.0))

$('clear').onclick = () => { clearFB(water.read); clearFB(water.write); clearWaterFlow(); fillWater(); if (FL.sim) fillFlip(); };

window.addEventListener('resize', () => { if (resizeCanvas()) initBuffers(); });

// ----- settings panel --------------------------------------------------------
const GRID = ['grid'], FLIPA = ['flip'];
const SCHEMA = [
  { k: 'gravity', label: 'Gravity', min: 0, max: 40, step: 0.5, hint: 'Screen heights per second². Earth-like for a ~30 cm tank is about 30.' },
  { k: 'flipRatio', label: 'FLIP blend (0 = smooth PIC, 1 = splashy FLIP)', min: 0, max: 1, step: 0.01, algos: FLIPA },
  { k: 'flipIters', label: 'Pressure iterations (CPU cost)', min: 10, max: 120, step: 5, algos: FLIPA,
    hint: 'More = water behaves more incompressibly, but costs more CPU.' },
  { k: 'density', label: 'Water density vs air', min: 2, max: 1000, step: 1, log: true, algos: GRID,
    hint: 'Real water is ≈ 800× denser than air. Lower = lighter water, faster but floatier splashes.' },
  { k: 'ballGrowth', label: 'Water ball growth speed', min: 0.05, max: 1, step: 0.05 },
  { k: 'tiltStrength', label: 'Tilt gravity strength', min: 0, max: 5, step: 0.1 },
  { k: 'velocityDissipation', label: 'Velocity damping', min: 0, max: 4, step: 0.05, algos: GRID },
  { k: 'pressure', label: 'Pressure persistence', min: 0, max: 1, step: 0.01, algos: GRID },
  { k: 'splatRadius', label: 'Brush size', min: 0.05, max: 1, step: 0.01 },
  { k: 'splatForce', label: 'Stir force', min: 500, max: 20000, step: 100 },
  { k: 'maxDpr', label: 'Render scale', min: 0.5, max: 3, step: 0.25, apply: () => { resizeCanvas(); initBuffers(); } },
];
const DEFAULTS = Object.assign({}, cfg);
const KEY = 'fluidCfg7';
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in saved) if (k in DEFAULTS) cfg[k] = saved[k]; } catch (_) {}
resizeCanvas(); initBuffers();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} };
const panel = $('panel'), widgets = {};
function addRow(html) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = html; panel.appendChild(d); return d; }
const rows = [];
{
  const r = addRow(`<label>Water algorithm</label><span></span><select style="grid-column:1/-1;font:inherit;padding:8px;border-radius:8px;background:#ffffff1f;color:#fff;border:1px solid #ffffff2e">
    <option value="grid" style="color:#000">Grid — two-phase solver (GPU)</option>
    <option value="flip" style="color:#000">FLIP — particles + grid (CPU)</option></select>
    <small style="grid-column:1/-1;color:#fff8">They are different methods with different looks and costs. Switching refills the tank.</small>`);
  r.dataset.algos = 'grid flip'; rows.push(r);
  const sel = r.querySelector('select'); sel.value = cfg.waterAlgo;
  sel.onchange = () => { setAlgo(sel.value); save(); };
  widgets.waterAlgo = () => { sel.value = cfg.waterAlgo; };
}
for (const s of SCHEMA) {
  const lo = s.log ? 0 : s.min, hi = s.log ? 1 : s.max, st = s.log ? 0.001 : s.step;
  const row = addRow(`<label>${s.label}</label><output></output><input type="range" min="${lo}" max="${hi}" step="${st}">`
    + (s.hint ? `<small style="grid-column:1/-1;color:#fff8;margin-top:-2px">${s.hint}</small>` : ''));
  row.dataset.algos = (s.algos || ['grid', 'flip']).join(' '); rows.push(row);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const fmt = v => s.log ? (v >= 100 ? Math.round(v) : +v.toPrecision(2)) + '×' : +(+v).toFixed(2);
  const toVal = t => s.log ? Math.round(s.min * Math.pow(s.max / s.min, t) * 10) / 10 : t;
  const show = () => { inp.value = s.log ? Math.log(cfg[s.k] / s.min) / Math.log(s.max / s.min) : cfg[s.k]; out.textContent = fmt(+cfg[s.k]); };
  inp.oninput = () => { cfg[s.k] = toVal(+inp.value); out.textContent = fmt(cfg[s.k]); if (!s.apply) save(); };
  if (s.apply) inp.onchange = () => { s.apply(); save(); };
  widgets[s.k] = show; show();
}
{
  const dRow = rows[SCHEMA.findIndex(x => x.k === 'density')];
  const box = document.createElement('div'); box.className = 'row'; box.dataset.algos = 'grid'; box.dataset.disp = 'flex'; box.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
  for (const [label, v] of [['Real water (800×)', 800], ['Balanced (100×)', 100], ['Light & fast (16×)', 16]]) {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { cfg.density = v; widgets.density(); save(); };
    box.appendChild(b);
  }
  dRow.after(box); rows.push(box);
}
function setAlgo(a) {
  cfg.waterAlgo = a;
  if (a === 'flip') { if (!FL.sim) buildFlip(); fillFlip(); }
  else { clearFB(water.read); clearFB(water.write); clearWaterFlow(); fillWater(); }
  if (widgets.waterAlgo) widgets.waterAlgo();
  applyModeVisibility();
}
function applyModeVisibility() {      // only show the settings that matter for the chosen water algorithm
  for (const r of rows) r.style.display = r.dataset.algos.split(' ').includes(cfg.waterAlgo) ? (r.dataset.disp || '') : 'none';
}
{
  const r = addRow(`<label>Resolution level</label><output></output><input type="range" min="0" max="${LEVELS.length - 1}" step="1">`);
  const inp = r.querySelector('input'), out = r.querySelector('output');
  const show = () => { inp.value = cfg.level; const L = LEVELS[cfg.level]; out.textContent = `${cfg.level} (sim ${L.sim}, surface ${L.tex})`; };
  inp.oninput = () => { cfg.level = +inp.value; perf.ceiling = LEVELS.length - 1; show(); };
  inp.onchange = () => { initBuffers(); save(); };
  widgets.level = show; show();
  const c = document.createElement('div'); c.className = 'row check';
  c.innerHTML = `<input type="checkbox" id="auto"><label for="auto">Auto-adjust resolution to keep 60 fps</label>`;
  panel.appendChild(c);
  const cb = c.querySelector('input'); cb.checked = cfg.auto;
  cb.onchange = () => { cfg.auto = cb.checked; perf.goodSecs = 0; save(); };
}
{
  const b = document.createElement('button'); b.textContent = 'Reset to defaults';
  b.onclick = () => {
    const algo = cfg.waterAlgo; Object.assign(cfg, DEFAULTS); perf.ceiling = LEVELS.length - 1; resizeCanvas(); initBuffers();
    for (const k in widgets) widgets[k]();
    if (algo !== cfg.waterAlgo) setAlgo(cfg.waterAlgo);
    applyModeVisibility(); panel.querySelector('#auto').checked = cfg.auto; save(); };
  panel.appendChild(b);
}
applyModeVisibility();
if (cfg.waterAlgo === 'flip' && !FL.sim) buildFlip();
$('gear').onclick = () => { document.body.classList.toggle('panel', panel.classList.toggle('open')); };

// ----- adaptive quality ----------------------------------------------------
const perf = { frames: 0, acc: 0, fps: 60, goodSecs: 0, ceiling: LEVELS.length - 1 };
function adapt(rawDt) {
  perf.frames++; perf.acc += rawDt;
  if (perf.acc < 1) return;               // evaluate once per second
  perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0;
  if (!cfg.auto) {}
  else if (perf.fps < 40 && cfg.level > 0) {
    cfg.level--; perf.ceiling = cfg.level; perf.goodSecs = 0; initBuffers();   // never climb back above a level that failed
  } else if (perf.fps > 55 && cfg.level < perf.ceiling) {
    if (++perf.goodSecs >= 3) { cfg.level++; perf.goodSecs = 0; initBuffers(); }
  } else perf.goodSecs = 0;
  if (widgets.level) widgets.level();
  const L = LEVELS[cfg.level];
  $('stats').textContent = `${Math.round(perf.fps)} fps · sim ${L.sim} · surface ${L.tex}`;
}

// ----- benchmark ---------------------------------------------------------------
// Runs the same scripted scene on both algorithms with a fixed time step (so results are comparable
// between runs and devices): a pool at rest, a ball of water dropped in, then settling. It reports how
// long each frame takes (simulation and drawing, synced with the GPU, so vsync doesn't hide it) and
// how well the water behaves (time to settle, leftover motion, volume drift).
const bench = { on: false, result: null };
const yieldUI = () => new Promise(r => setTimeout(r, 0));
const pct = (a, p) => { const b = [...a].sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(b.length * p))]; };
const avg = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
function readRGBA(fb) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fbo);
  const a = new Float32Array(fb.w * fb.h * 4); gl.readPixels(0, 0, fb.w, fb.h, gl.RGBA, gl.FLOAT, a); return a;
}
// gl.finish() is a no-op in some browsers; reading one pixel back really waits for the GPU
const px1 = new Float32Array(4), px8 = new Uint8Array(4);
function syncGPU(fb) {
  try {
    if (fb) { gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fbo); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px1); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px8); }
  } catch (_) { gl.finish(); }
}
function benchSpeed(algo) {                       // RMS water speed, in screen heights per second
  try {
    if (algo === 'flip') {
      const f = FL.sim; let k = 0; for (let i = 0; i < f.np; i++) k += f.vel[2 * i] ** 2 + f.vel[2 * i + 1] ** 2;
      return Math.sqrt(k / Math.max(1, f.np)) / f.ny;
    }
    let k = 0, n = 0;
    for (const T of [WS.U.read, WS.V.read]) { const a = readRGBA(T); for (let i = 0; i < a.length; i += 4) { k += a[i] * a[i]; n++; } }
    return Math.sqrt(k / n) / WS.grid[1];
  } catch (_) { return NaN; }
}
function benchVolume(algo) {                      // water volume as a fraction of the tank
  try {
    if (algo === 'flip') return FL.sim.np / (FL.sim.nx * FL.sim.ny * 3.2);
    const a = readRGBA(massTex); let k = 0; for (let i = 0; i < a.length; i += 4) k += a[i]; return k / (massTex.w * massTex.h);
  } catch (_) { return NaN; }
}
async function benchAlgo(algo, progress) {
  setAlgo(algo); tilt.on = false; grav.x = 0; grav.y = -1; pointers.clear();
  const dt = 1 / 60, run = algo === 'flip' ? stepFlip : stepWater, stepMs = [], drawMs = [];
  const one = (record) => {
    const t0 = performance.now(); run(dt); syncGPU(water); const t1 = performance.now(); render(); syncGPU(null); const t2 = performance.now();
    if (record) { stepMs.push(t1 - t0); drawMs.push(t2 - t1); }
  };
  progress(`${algo}: warming up…`);
  for (let i = 0; i < 40; i++) { one(false); if (i % 8 === 7) await yieldUI(); }
  const restSpeed = benchSpeed(algo);
  stampBall(0.5, 0.75, 0.12);                     // the scripted splash
  const vol0 = benchVolume(algo);
  let settle = null, t = 0, last = NaN;
  for (let i = 0; i < 540; i++) {
    one(i < 120); t += dt;                        // timing is recorded over the first 2 s of splash
    if (i % 6 === 5) {
      last = benchSpeed(algo);
      if (settle === null && i > 30 && last < 0.05) settle = t;
    }
    if (i % 8 === 7) { progress(`${algo}: ${Math.round(100 * i / 540)}%`); await yieldUI(); }
  }
  const vol1 = benchVolume(algo), frame = stepMs.map((v, i) => v + drawMs[i]);
  return {
    algorithm: algo,
    particles: algo === 'flip' ? FL.sim.np : null,
    grid: algo === 'flip' ? [FL.sim.nx, FL.sim.ny] : WS.grid.slice(),
    msPerFrame: { avg: +avg(frame).toFixed(2), p95: +pct(frame, 0.95).toFixed(2), worst: +Math.max(...frame).toFixed(2) },
    stepMsAvg: +avg(stepMs).toFixed(2), drawMsAvg: +avg(drawMs).toFixed(2),
    maxFps: Math.round(1000 / avg(frame)),
    restSpeedBefore: +restSpeed.toFixed(4),
    settleSeconds: settle === null ? null : +settle.toFixed(2),
    speedAtEnd: +last.toFixed(4),
    volumeDriftPercent: +(100 * (vol1 - vol0) / vol0).toFixed(2),
  };
}
async function runBenchmark(progress = () => {}) {
  const saved = { algo: cfg.waterAlgo, auto: cfg.auto };
  bench.on = true; cfg.auto = false;
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const out = {
    when: new Date().toISOString(), userAgent: navigator.userAgent, cores: navigator.hardwareConcurrency || null,
    gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown', pixelRatio: window.devicePixelRatio,
    canvas: [canvas.width, canvas.height], level: cfg.level, settings: { gravity: cfg.gravity, density: cfg.density, flipRatio: cfg.flipRatio, flipIters: cfg.flipIters },
    results: {},
  };
  try { for (const algo of ['grid', 'flip']) out.results[algo] = await benchAlgo(algo, progress); }
  finally { setAlgo(saved.algo); cfg.auto = saved.auto; bench.on = false; }
  bench.result = out; window.benchResult = out;
  return out;
}
// Frame cost of both algorithms at every resolution level (splash scene, no settling analysis): shows
// which level each algorithm can afford on this device.
async function runSweep(progress = () => {}) {
  const saved = { algo: cfg.waterAlgo, auto: cfg.auto, level: cfg.level };
  bench.on = true; cfg.auto = false;
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const out = { when: new Date().toISOString(), gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown', cores: navigator.hardwareConcurrency || null,
    canvas: [canvas.width, canvas.height], settings: { gravity: cfg.gravity, density: cfg.density, flipRatio: cfg.flipRatio, flipIters: cfg.flipIters }, levels: [] };
  try {
    for (let l = 0; l < LEVELS.length; l++) {
      cfg.level = l; initBuffers();
      const row = { level: l, sim: LEVELS[l].sim, surface: LEVELS[l].tex };
      for (const algo of ['grid', 'flip']) {
        progress(`level ${l + 1}/${LEVELS.length}: ${algo}…`); await yieldUI();
        setAlgo(algo); tilt.on = false; grav.x = 0; grav.y = -1; pointers.clear();
        const dt = 1 / 60, run = algo === 'flip' ? stepFlip : stepWater, step = [], draw = [];
        const one = rec => { const t0 = performance.now(); run(dt); syncGPU(water); const t1 = performance.now(); render(); syncGPU(null); const t2 = performance.now(); if (rec) { step.push(t1 - t0); draw.push(t2 - t1); } };
        for (let i = 0; i < 20; i++) one(false);
        stampBall(0.5, 0.75, 0.12);
        for (let i = 0; i < 60; i++) { one(true); if (i % 10 === 9) await yieldUI(); }
        const tot = step.map((v, i) => v + draw[i]);
        row[algo] = { ms: +avg(tot).toFixed(1), p95: +pct(tot, 0.95).toFixed(1), step: +avg(step).toFixed(1), draw: +avg(draw).toFixed(1), fps: Math.round(1000 / avg(tot)), particles: algo === 'flip' ? FL.sim.np : null };
      }
      out.levels.push(row);
    }
  } finally { cfg.level = saved.level; initBuffers(); setAlgo(saved.algo); cfg.auto = saved.auto; bench.on = false; }
  const best = a => { const ok = out.levels.filter(r => r[a].p95 <= 16.7); return ok.length ? ok[ok.length - 1].level : null; };
  out.recommended = { grid: best('grid'), flip: best('flip') };       // highest level whose 95th-percentile frame still fits 60 fps
  window.sweepResult = out; return out;
}
function formatSweep(r) {
  const rows = r.levels.map(x => `L${x.level} ${String(x.sim).padStart(3)}/${String(x.surface).padStart(4)}  ${String(x.grid.ms).padStart(6)} ${String(x.grid.fps).padStart(4)}   ${String(x.flip.ms).padStart(6)} ${String(x.flip.fps).padStart(4)} ${String(x.flip.particles).padStart(6)}`);
  const rec = v => v === null ? 'none reaches 60 fps' : 'level ' + v;
  return [`GPU: ${r.gpu}`, `canvas ${r.canvas.join('x')}, ${r.cores ?? '?'} cores`, '', 'level sim/surf   grid ms  fps    flip ms  fps  parts', ...rows, '',
    `60 fps (p95): Grid ${rec(r.recommended.grid)}, FLIP ${rec(r.recommended.flip)}`].join('\n');
}
function formatBench(r) {
  const g = r.results.grid, f = r.results.flip, row = (label, a, b) => label.padEnd(26) + String(a).padStart(10) + String(b).padStart(10);
  const n = v => v === null ? '>9s' : v;
  return [`GPU: ${r.gpu}`, `Level ${r.level}, canvas ${r.canvas.join('x')}, ${r.cores ?? '?'} cores`, '',
    row('', 'Grid', 'FLIP'),
    row('max fps (GPU-synced)', g.maxFps, f.maxFps),
    row('ms/frame avg', g.msPerFrame.avg, f.msPerFrame.avg),
    row('  simulation', g.stepMsAvg, f.stepMsAvg),
    row('  drawing', g.drawMsAvg, f.drawMsAvg),
    row('ms/frame p95', g.msPerFrame.p95, f.msPerFrame.p95),
    row('ms/frame worst', g.msPerFrame.worst, f.msPerFrame.worst),
    row('particles', g.particles ?? '-', f.particles),
    row('settle time (s)', n(g.settleSeconds), n(f.settleSeconds)),
    row('speed at end (h/s)', g.speedAtEnd, f.speedAtEnd),
    row('volume drift %', g.volumeDriftPercent, f.volumeDriftPercent)].join('\n');
}
{
  const box = document.createElement('div'); box.className = 'row'; box.style.cssText = 'display:block';
  box.innerHTML = `<button id="bench">Run benchmark (~30 s)</button> <button id="sweep">Sweep all levels (~40 s)</button> <button id="benchCopy" hidden>Copy results</button>
    <pre id="benchOut" style="white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;color:#fffc;margin:10px 0 0"></pre>
    <small style="color:#fff8">Runs a scripted splash on both algorithms at the current resolution level with a fixed time step. Keep the tab in front and leave the phone alone.</small>`;
  const reset = panel.lastChild; panel.insertBefore(box, reset);
  const out = box.querySelector('#benchOut'), run = box.querySelector('#bench'), sweep = box.querySelector('#sweep'), copy = box.querySelector('#benchCopy');
  let lastJSON = null;
  const go = (btn, job, fmt) => async () => {
    run.disabled = sweep.disabled = true; copy.hidden = true;
    try { const r = await job(m => { out.textContent = m; }); out.textContent = fmt(r); lastJSON = r; copy.hidden = false; console.log('benchmark', JSON.stringify(r)); }
    catch (e) { out.textContent = 'Benchmark failed: ' + e.message; }
    run.disabled = sweep.disabled = false;
  };
  run.onclick = go(run, runBenchmark, formatBench);
  sweep.onclick = go(sweep, runSweep, formatSweep);
  copy.onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(lastJSON, null, 2)); copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy results', 1500); } catch (_) {} };
}
// ?bench in the URL runs it automatically and leaves the numbers in window.benchResult (handy for CI / comparing devices)
if (/[?&]sweep\b/.test(location.search)) setTimeout(() => runSweep(m => { document.title = m; }).then(r => { document.title = 'sweep done'; console.log('sweep', JSON.stringify(r)); }), 500);
if (/[?&]bench\b/.test(location.search)) setTimeout(() => runBenchmark(m => { document.title = m; }).then(r => { document.title = 'bench done'; console.log('benchmark', JSON.stringify(r)); }), 500);

// ----- main loop -----------------------------------------------------------
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(Math.max(raw, 0.001), 1 / 30);
  if (bench.on) { requestAnimationFrame(frame); return; }          // the benchmark drives the simulation itself
  updateGravity(dt); applyPointers(dt);
  if (cfg.waterAlgo === 'flip') stepFlip(dt); else stepWater(dt);
  render();
  if (raw < 0.5) adapt(raw);              // ignore tab-switch hiccups
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('WebGL context lost. Reload the page.'); });
</script>
